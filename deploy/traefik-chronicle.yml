# Chronicle routers and middlewares for config/traefik/dynamic/routers.yml.
#
# Paste into the existing `http.routers` / `http.middlewares` maps in that file
# — this is a fragment, not a loadable standalone config.
#
# Shape is Lyceum's (SERV-60), one for one: the SAME backend served on two
# hosts, one tunneled and Access-gated, one direct on the WAN entrypoint where
# the app authenticates itself. Chronicle earns the direct host because CHRN-71
# landed: every route outside /healthz and /readyz requires a session, and the
# two sign-in endpoints are the only unauthenticated surface.

http:
  middlewares:
    # Edge throttle on the credential endpoints, applied ONLY via the
    # chronicle-public-auth router below so it covers invite redemption and
    # Cloudflare SSO exchange without touching upload traffic. Sits on top of
    # Chronicle's own in-process limiter, which exists for a different threat:
    # the container is reachable on construct_net by every other service on the
    # box WITHOUT passing Traefik, so the edge limiter does nothing for that
    # path and the in-process one does nothing about volume from the WAN.
    #
    # Per client IP — the public entrypoint sets `forwardedHeaders.trustedIPs:
    # []` and so trusts no client-supplied X-Forwarded-*. Same numbers as
    # lyceum-login-ratelimit: 5 req/s sustained, bursts to 15.
    chronicle-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

  routers:
    # ------------- INTERNAL entrypoint: tunneled, Access-enforced -------------
    # Reachable only via cloudflared. Carries cf-access-jwt like every other
    # router on this entrypoint (SERV-106); check-edge-auth.sh fails if a new
    # one is added without it.
    #
    # Adding this router ALSO requires adding chronicle.zerogravity.industries
    # to the guard's CF_ACCESS_AUD_MAP — check #2 of check-edge-auth.sh requires
    # the map to cover exactly the gated hosts, so a router with no AUD entry
    # fails the config check rather than silently serving unmapped.
    chronicle:
      entryPoints:
        - internal
      rule: "Host(`chronicle.zerogravity.industries`)"
      service: chronicle
      middlewares:
        - cf-access-jwt
      # No TLS: internal is plain HTTP. Cloudflare terminates at the edge and
      # the tunnel encrypts the wire.

    # ------------- PUBLIC entrypoint: the app / MCP path -------------
    # The Android app and MCP hold a bearer session and cannot do browser SSO,
    # so they need a host that is not Access-gated. On this estate that means a
    # direct router on `public`, because every router on `internal` must carry
    # cf-access-jwt.
    #
    # The bar for that, in routers.yml's own words, is that the endpoint
    # authenticates "with something Cloudflare Access cannot express."
    # Chronicle now does: a one-time invite redeemed into a durable per-device
    # session, verified in-process on every route (CHRN-71). This router was
    # written and left commented out until that was true.
    #
    # strip-cf-access ensures a spoofed Cf-Access-* on this path authenticates
    # nobody — and Chronicle verifies the Access JWT itself rather than trusting
    # the header, so a dropped middleware here cannot forge an identity either.
    chronicle-public:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`)"
      service: chronicle
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same backend, but /auth/* gets the login rate-limit. A SEPARATE
    # higher-priority router rather than another middleware on the one above —
    # matching argosy-auth and lyceum-public-auth — because the limit must not
    # reach upload traffic. CHRN-20 is resumable upload of memos recorded at
    # arbitrary length, and a 5 req/s bucket across a chunked 40-minute upload
    # would throttle ingest rather than attackers.
    chronicle-public-auth:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`) && PathPrefix(`/auth/`)"
      priority: 1000
      service: chronicle
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - chronicle-login-ratelimit
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # /admin is NOT served on the WAN host. CHRN-16's Done-when is "`/admin`
    # requires Access, and the app path does not", and matching on Host alone
    # would have served both from chronicle-public — putting
    # POST /admin/users/{id}/invite, which mints a live credential, on the open
    # 443 behind only requireOwner and outside the /auth/ rate limit.
    #
    # Highest priority so it beats both routers above, and pointed at the same
    # blackhole + deny-all pair public-catchall uses, so the response is a 403
    # rather than a route to a backend that would have answered.
    #
    # Lyceum does not do this — its whole surface is on both hosts. The
    # difference is not a judgement about Lyceum: Chronicle's ticket states the
    # property explicitly, so serving /admin here would be an unstated
    # departure from it. The owner administers accounts from a browser through
    # Access; nothing the app or MCP does needs /admin.
    chronicle-public-admin:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`) && PathPrefix(`/admin`)"
      priority: 2000
      service: blackhole
      middlewares:
        - deny-all
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # NOTE for whoever pastes this in: `public-catchall`'s comment in
    # routers.yml reads "Any Host/SNI on :public that is not Argosy or the
    # Lyceum direct host is refused (403)." It needs Chronicle adding to that
    # sentence. The rule itself is a lowest-priority HostRegexp catch-all and
    # does not change — only the comment, which is the thing a reader trusts.

  services:
    chronicle:
      loadBalancer:
        servers:
          - url: "http://chronicle:4009"

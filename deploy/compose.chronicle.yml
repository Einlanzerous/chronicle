# Chronicle service fragment for construct-server's docker-compose.yml.
#
# NOT a standalone stack — this is the block to paste into
# ~/construct-server/docker-compose.yml, which owns the shared networks,
# Postgres and Traefik. Kept here so Chronicle's deploy shape is reviewable in
# Chronicle's own repo rather than only in the server repo.
#
# Prerequisites, in order:
#   1. deploy/provision-db.sh has run (database + roles exist)
#   2. CHRONICLE_DB_PASSWORD reaches .env — add the Signet target:
#        signet target add-key --project construct-server \
#          --path /home/magos/construct-server/.env --name CHRONICLE_DB_PASSWORD
#        signet target add-key --project construct-server \
#          --path /opt/construct-server/.env --name CHRONICLE_DB_PASSWORD
#        signet sync
#   3. The image exists: ghcr.io/einlanzerous/chronicle. Published by
#      .github/workflows/publish.yml (CHRN-73) — NOT by CHRN-17, which this
#      line named until 2026-08-24 and which never built an image. That claim
#      is why CHRN-16 reached a deploy with no artifact to deploy.

services:
  chronicle:
    image: ghcr.io/einlanzerous/chronicle:${CHRONICLE_TAG:-latest}
    container_name: chronicle
    restart: unless-stopped
    # No `ports:` on purpose. Chronicle is reached through Traefik on the
    # internal entrypoint, never from the host. Publishing a port here would
    # put an unauthenticated listener on the host and bypass the edge entirely.
    environment:
      - CHRONICLE_PORT=4009
      - CHRONICLE_DATABASE_URL=postgres://chronicle:${CHRONICLE_DB_PASSWORD}@postgres:5432/chronicle?sslmode=disable
      - CHRONICLE_LOG_LEVEL=${CHRONICLE_LOG_LEVEL:-info}
      - CHRONICLE_LOG_FORMAT=${CHRONICLE_LOG_FORMAT:-json}
      - CHRONICLE_SHUTDOWN_GRACE=${CHRONICLE_SHUTDOWN_GRACE:-20s}
      # CHRN-71. Auth is unconditional — there is no flag to leave off — so the
      # owner identity is required to serve. Unset, the owner keeps migration
      # 0002's placeholder, which can never match a Cloudflare-verified email,
      # and browser sign-in would look configured and silently never work.
      - CHRONICLE_OWNER_EMAIL=${CHRONICLE_OWNER_EMAIL}
      - CHRONICLE_OWNER_NAME=${CHRONICLE_OWNER_NAME:-}
      # Cloudflare Access SSO: both or neither. Chronicle verifies the JWT
      # itself rather than trusting the header the edge injects, so these are
      # the team domain and the Access application's audience tag.
      #
      # The AUD is a LITERAL here, not a .env indirection, matching how
      # switchyard and lyceum carry theirs. It is not a secret — it identifies
      # an Access application, it does not authorise anything — and
      # check-edge-auth.sh reads it straight out of this file to assert it
      # agrees with the guard's CF_ACCESS_AUD_MAP entry for this host. Behind a
      # ${...} the check has nothing to read.
      #
      # It MUST equal the chronicle.zerogravity.industries entry in
      # CF_ACCESS_AUD_MAP on the cf-access-guard service. Two copies of one
      # identity is not ideal, but they are checked against each other rather
      # than trusted: the edge and the origin disagreeing about which
      # application guards this host is exactly what SERV-106 exists to catch.
      #
      # BOTH are literals, and they must move together: config.Load errors when
      # exactly one of the pair is set, and runServe returns that error, so a
      # literal AUD beside an empty ${...} team domain crash-loops the container
      # before migration 0002 ever applies. The team domain is estate-wide and
      # identical to what switchyard, lyceum and the guard already carry.
      - CHRONICLE_CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      - CHRONICLE_CF_ACCESS_AUD=48bc1ca35a8a6bcf17c242cac59e209a53e58e5213b1656c82d3053df062f1ec
      # The origin baked into an invite's sign-in QR. It must be the direct
      # host: a link built from the Access-gated hostname walks a phone into an
      # SSO wall a bearer token cannot open. Literal for the same reason as the
      # pair above — it is a hostname, not a secret, and left empty the invite
      # response simply omits the sign-in link, so CHRN-59's one-scan onboarding
      # degrades to typing an address with nothing reporting why.
      - CHRONICLE_MOBILE_BASE_URL=https://chronicle-direct.zerogravity.industries
      # Secure on the session cookie. NOT derived from the request: TLS
      # terminates at Traefik, so the app never sees a TLS connection and
      # deriving it would drop the flag off a durable credential on the
      # WAN-facing entrypoint. Only set this false for a plain-HTTP LAN install.
      - CHRONICLE_COOKIE_SECURE=${CHRONICLE_COOKIE_SECURE:-true}
      # Whose X-Forwarded-For the sign-in rate limiter may believe (CHRN-75).
      #
      # This replaced CHRONICLE_TRUSTED_PROXIES, and the comment that used to
      # sit here claimed the old value made the header "trustworthy from Traefik
      # and from nowhere else". That was FALSE: the default was 172.16.0.0/12,
      # which CONTAINS construct_net (172.19.0.0/16), so every container on the
      # box was a trusted proxy and could pick its own rate-limit bucket by
      # writing a header. No CIDR can fix it — Traefik takes a DHCP address on
      # construct_net and nothing distinguishes it from a neighbour.
      #
      # So the trust decision is a shared secret only Traefik can produce.
      # Traefik stamps it with `customRequestHeaders`, which OVERWRITES whatever
      # the caller sent, so through the edge it is honest and around the edge a
      # forgery stays a forgery. Chronicle compares it in constant time and
      # never treats mere presence as trust.
      #
      # ⚠ REQUIRES SERV-148, in three parts: the Signet secret,
      # an env line on the TRAEFIK service, and the middleware in
      # config/traefik/dynamic/routers.yml templated as
      # '{{ env "CHRONICLE_PROXY_SECRET" }}' — the file provider does not expand
      # ${...}, so a $-style reference would stamp the literal string.
      #
      # Unset, every request through the proxy shares one bucket and the server
      # warns at boot. Set but NOT MATCHING behaves identically, and warns once
      # a minute at runtime instead. So does set-but-never-presented, which is
      # what a half-applied SERV-148 looks like: parts 1 and 2 landed, and the
      # middleware missing from one router. All three degraded states are one
      # shared bucket, and none of them is silent.
      - CHRONICLE_PROXY_SECRET=${CHRONICLE_PROXY_SECRET:-}
      # CHRN-23. Where memo audio lives. Inside the container this is the same
      # path as on the host so a path in a log line means one thing wherever it
      # is read. /data is the NVMe (458 G, 256 G free) and is what Copyparty
      # already serves at /w/hdd, which is why CHRN-19's watched folder lands
      # under the same root.
      #
      # The service does NOT create this. A typo'd path springing into
      # existence is how audio ends up on the container's writable layer
      # instead of the volume, which looks like it works until the next
      # redeploy takes the corpus with it — so an unreadable path fails the
      # boot, loudly, rather than being invented.
      #
      # CHRN-20 also turns this into the switch for the app's upload endpoint:
      # set, POST /memos/uploads serves; unset, all four /memos/uploads routes
      # answer 503 naming this variable and the boot log says which branch it
      # took. Uploads in flight are assembled in .uploads/ under this root —
      # created by the service, because it is a fixed name inside a path you
      # already supplied rather than a path anyone can mistype, and inside the
      # root because finalising is an os.Rename and rename is atomic only
      # within one filesystem. It is reported apart from the corpus in
      # GET /admin/storage and swept hourly.
      - CHRONICLE_AUDIO_DIR=/data/chronicle/audio
      # CHRN-19. The Copyparty-fed inbox, with ONE SUBDIRECTORY PER ACCOUNT
      # named after the account's UUID. A file carries no identity of its own
      # and tier2.memos.author_id is NOT NULL, so the directory is the only
      # thing that can supply one -- which is why the watcher never creates a
      # directory and ignores any that does not name an existing account.
      #
      # Unset, no watcher runs and the upload path (CHRN-20, now live) is the
      # only ingest. Set without CHRONICLE_AUDIO_DIR the service REFUSES to start:
      # a watcher with nowhere to copy files to would record memos whose audio
      # is immediately missing.
      #
      # ⚠ Copyparty does not serve this directory yet. copyparty.conf publishes
      # exactly one volume, [/] -> /w/hdd/media, so /data/chronicle/inbox is on
      # the same disk but is NOT reachable from a phone. A construct-server
      # change adds it; until then the watcher works and nothing fills it. See
      # deploy/README.md step 5.
      - CHRONICLE_INBOX_DIR=/data/chronicle/inbox
      # Defaults are 5s and 10s (internal/watch). The settle window is how long
      # a file must be untouched before it is read -- one of three guards
      # against reading a half-written upload. Raise it for a slow sync client;
      # it is not the guarantee (the re-stat after the copy is), but it is what
      # keeps the guarantee from having to fire.
      - CHRONICLE_WATCH_INTERVAL=${CHRONICLE_WATCH_INTERVAL:-5s}
      - CHRONICLE_WATCH_SETTLE=${CHRONICLE_WATCH_SETTLE:-10s}
      # Transcription (CHRN-27). The estate ASR service, reached
      # container-to-container on construct_net -- it publishes no port, so
      # this is the only way to it.
      #
      # BOTH OR NEITHER: config.Load errors when exactly one is set, so a URL
      # beside an empty token crash-loops rather than failing every submission
      # with a 401 that reads like the token was wrong. Unset, Chronicle boots
      # and warns, memos are ingested and never transcribed, and
      # GET /admin/transcription says so -- which is the point: an ingest path
      # that files memos nobody transcribes looks entirely healthy until
      # somebody goes looking for a transcript.
      #
      # The token is a .env indirection and the URL is a literal, for the
      # reason the Access pair above gives: a hostname is not a secret, and a
      # credential never belongs in a compose file. Add the Signet target:
      #   signet target add-key --project construct-server \
      #     --path /opt/construct-server/.env --name CHRONICLE_ASR_TOKEN
      # It must equal the `chronicle:` half of ASR_CLIENT_TOKENS on the asr
      # service (asr/deploy/compose.asr.yml).
      - CHRONICLE_ASR_URL=http://asr:4011
      - CHRONICLE_ASR_TOKEN=${CHRONICLE_ASR_TOKEN}
      # Empty takes the ASR deployment's own default, which is the right
      # behaviour: it knows what models are on its disk and Chronicle does not.
      - CHRONICLE_ASR_MODEL=${CHRONICLE_ASR_MODEL:-}
      - CHRONICLE_TRANSCRIBE_INTERVAL=${CHRONICLE_TRANSCRIBE_INTERVAL:-10s}
    volumes:
      # rw: the only durable store for tier-2 audio, which nothing regenerates.
      # Create both before the first boot or the container refuses to start:
      #   sudo mkdir -p /data/chronicle/audio /data/chronicle/inbox
      #
      # Ownership is not the gate today — deploy/Dockerfile sets no USER, so the
      # process is root in the container. If that ever changes, this directory
      # needs an owner to match, and the failure would be a write error on
      # ingest rather than at boot.
      - /data/chronicle:/data/chronicle
    networks:
      - construct_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz takes no dependencies, so this reports on the process only.
      # Readiness (which pings Postgres) is deliberately NOT the healthcheck:
      # restarting the container is the wrong remedy for a database blip.
      test: ["CMD", "wget", "-qO-", "http://localhost:4009/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Graceful shutdown needs longer than Docker's 10s default or a redeploy
    # kills in-flight ingest, which loses memos. Must exceed
    # CHRONICLE_SHUTDOWN_GRACE.
    stop_grace_period: 30s

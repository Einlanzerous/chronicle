name: publish

# Builds the production image (deploy/Dockerfile: one static Go binary) and
# pushes it to GHCR (CHRN-73). construct-server pulls
# ghcr.io/einlanzerous/chronicle:latest. `main` publishes :latest and a
# short-sha tag; release-please's v* tags publish the semver tags.
#
# Opened because CHRN-16 could not deploy: compose referenced this image and
# nothing had ever built it. `CLAUDE.md` promised "Release-please + GHCR image"
# from the start; this is the half that was missing.

on:
  push:
    branches: [main]
    # asr/ is a sealed subtree (CHRN-82): nothing Chronicle links lives under
    # it, so a commit that touches only asr/ cannot change this binary and
    # builds publish-asr.yml's image instead. Path filters do not apply to tag
    # pushes, so a release tag always builds.
    paths-ignore:
      - "asr/**"
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# Two merges to main in quick succession would otherwise race on :latest with no
# ordering guarantee, and the loser silently wins. Not cancel-in-progress: a
# half-pushed manifest is worse than a slow queue, and the tag path must never be
# cancelled by a subsequent main push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own token. Publishing needs no secret of its own — that is
          # what `permissions: packages: write` above is for.
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/einlanzerous/chronicle
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # is_default_branch, NOT the default `enable=true`. Release-please
            # tags the release PR's MERGE COMMIT, so the main push and the v* tag
            # build see the same github.sha — and with no event restriction both
            # runs push sha-<short>, one built with VERSION= (reports `dev`) and
            # one with VERSION=0.1.0. Last writer wins by job scheduling, so the
            # sha tag would resolve to an image whose reported identity disagrees
            # with its own label, non-deterministically. That is precisely the
            # failure the VERSION comment below exists to prevent, arriving by a
            # different door. compose reads ${CHRONICLE_TAG:-latest}, so pinning
            # a sha tag is expected usage rather than hypothetical.
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity, read back by `chronicle version` and /healthz.
          #
          # VERSION is passed ONLY on a tag build. On a push to main
          # `steps.meta.outputs.version` is the literal string `latest`, and
          # `latest` names a moving target rather than a build: stamping it
          # would put "latest" into the delivery ledger as an identity, to be
          # compared against whatever the image label says and disagree for
          # ever. Blank instead, which cmd/chronicle's buildVersion() maps to
          # "dev" — the honest answer for a build no release cut. Note the
          # Dockerfile defaults both ARGs to empty for the same reason: an image
          # built outside this workflow must not be able to claim a release.
          #
          # On a tag build metadata-action's `version` output is the BARE semver
          # (`0.2.0`), matching the image label character for character.
          #
          # GIT_SHA is passed on both paths — a main build has a real commit and
          # should say so, it just has no release to name.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

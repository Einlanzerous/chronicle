# Chronicle service fragment for construct-server's docker-compose.yml.
#
# NOT a standalone stack — this is the block to paste into
# ~/construct-server/docker-compose.yml, which owns the shared networks,
# Postgres and Traefik. Kept here so Chronicle's deploy shape is reviewable in
# Chronicle's own repo rather than only in the server repo.
#
# Prerequisites, in order:
#   1. deploy/provision-db.sh has run (database + roles exist)
#   2. CHRONICLE_DB_PASSWORD reaches .env — add the Signet target:
#        signet target add-key --project construct-server \
#          --path /home/magos/construct-server/.env --name CHRONICLE_DB_PASSWORD
#        signet target add-key --project construct-server \
#          --path /opt/construct-server/.env --name CHRONICLE_DB_PASSWORD
#        signet sync
#   3. The image exists: ghcr.io/einlanzerous/chronicle. Published by
#      .github/workflows/publish.yml (CHRN-73) — NOT by CHRN-17, which this
#      line named until 2026-08-24 and which never built an image. That claim
#      is why CHRN-16 reached a deploy with no artifact to deploy.

services:
  chronicle:
    image: ghcr.io/einlanzerous/chronicle:${CHRONICLE_TAG:-latest}
    container_name: chronicle
    restart: unless-stopped
    # No `ports:` on purpose. Chronicle is reached through Traefik on the
    # internal entrypoint, never from the host. Publishing a port here would
    # put an unauthenticated listener on the host and bypass the edge entirely.
    environment:
      - CHRONICLE_PORT=4009
      - CHRONICLE_DATABASE_URL=postgres://chronicle:${CHRONICLE_DB_PASSWORD}@postgres:5432/chronicle?sslmode=disable
      - CHRONICLE_LOG_LEVEL=${CHRONICLE_LOG_LEVEL:-info}
      - CHRONICLE_LOG_FORMAT=${CHRONICLE_LOG_FORMAT:-json}
      - CHRONICLE_SHUTDOWN_GRACE=${CHRONICLE_SHUTDOWN_GRACE:-20s}
      # CHRN-71. Auth is unconditional — there is no flag to leave off — so the
      # owner identity is required to serve. Unset, the owner keeps migration
      # 0002's placeholder, which can never match a Cloudflare-verified email,
      # and browser sign-in would look configured and silently never work.
      - CHRONICLE_OWNER_EMAIL=${CHRONICLE_OWNER_EMAIL}
      - CHRONICLE_OWNER_NAME=${CHRONICLE_OWNER_NAME:-}
      # Cloudflare Access SSO: both or neither. Chronicle verifies the JWT
      # itself rather than trusting the header the edge injects, so these are
      # the team domain and the Access application's audience tag.
      #
      # The AUD is a LITERAL here, not a .env indirection, matching how
      # switchyard and lyceum carry theirs. It is not a secret — it identifies
      # an Access application, it does not authorise anything — and
      # check-edge-auth.sh reads it straight out of this file to assert it
      # agrees with the guard's CF_ACCESS_AUD_MAP entry for this host. Behind a
      # ${...} the check has nothing to read.
      #
      # It MUST equal the chronicle.zerogravity.industries entry in
      # CF_ACCESS_AUD_MAP on the cf-access-guard service. Two copies of one
      # identity is not ideal, but they are checked against each other rather
      # than trusted: the edge and the origin disagreeing about which
      # application guards this host is exactly what SERV-106 exists to catch.
      - CHRONICLE_CF_ACCESS_TEAM_DOMAIN=${CHRONICLE_CF_ACCESS_TEAM_DOMAIN:-}
      - CHRONICLE_CF_ACCESS_AUD=48bc1ca35a8a6bcf17c242cac59e209a53e58e5213b1656c82d3053df062f1ec
      # The origin baked into an invite's sign-in QR. It must be the direct
      # host: a link built from the Access-gated hostname walks a phone into an
      # SSO wall a bearer token cannot open.
      - CHRONICLE_MOBILE_BASE_URL=${CHRONICLE_MOBILE_BASE_URL:-}
      # Secure on the session cookie. NOT derived from the request: TLS
      # terminates at Traefik, so the app never sees a TLS connection and
      # deriving it would drop the flag off a durable credential on the
      # WAN-facing entrypoint. Only set this false for a plain-HTTP LAN install.
      - CHRONICLE_COOKIE_SECURE=${CHRONICLE_COOKIE_SECURE:-true}
      # Whose X-Forwarded-For the sign-in rate limiter may believe. Traefik's
      # entrypoints set `forwardedHeaders.trustedIPs: []`, so it overwrites
      # whatever a caller sent with the address it actually saw — which makes
      # this trustworthy from Traefik and from nowhere else. Unset, every
      # request through the proxy shares one bucket and one attacker can lock
      # out every real user; the server warns at boot when that is the case.
      - CHRONICLE_TRUSTED_PROXIES=${CHRONICLE_TRUSTED_PROXIES:-172.16.0.0/12}
    networks:
      - construct_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz takes no dependencies, so this reports on the process only.
      # Readiness (which pings Postgres) is deliberately NOT the healthcheck:
      # restarting the container is the wrong remedy for a database blip.
      test: ["CMD", "wget", "-qO-", "http://localhost:4009/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Graceful shutdown needs longer than Docker's 10s default or a redeploy
    # kills in-flight ingest, which loses memos. Must exceed
    # CHRONICLE_SHUTDOWN_GRACE.
    stop_grace_period: 30s

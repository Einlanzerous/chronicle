# CHRN-36 — the routing eval set, v1.
#
# THE LABELS ARE HERE. THE REAL TRANSCRIPTS ARE NOT, and that is the decision
# rather than an omission: they are tier 2, their home is `tier2.transcripts`
# behind the boundary migration 0007 draws, and this repository is public.
# A real label names its memo by `tier2.memos.content_hash` and nothing else.
#
# The consequence, stated in the decision and repeated here because this is the
# file where it bites: a reviewer reading `<hash> -> NOTE, because it argues a
# principle` cannot check that from the repo alone. They need the corpus. The
# `# NNs` comment on each real entry is its duration, which is what makes this
# file checkable against the table in §3 of the decision without naming
# anything the decision does not already name.
#
# The synthetic stratum IS committed in full, and the test that settles why is
# one question: did a person say this into a recorder? Nobody said these. They
# are fixtures written to test a router, so they are not authored corpus and
# they have no other home.
#
#   decision:  docs/decisions/chrn-36-routing-eval-set.md
#   harness:   internal/scribe/eval
#   run:       chronicle eval --dry-run           (resolution, no model needed)
#              chronicle eval --stratum synthetic (development)
#              chronicle eval --stratum real      (held out — log every run, §2)
#
# `confident` and `also_defensible` are load-bearing. Where two labels are both
# defensible, the router picking the other one is not a failure — it is the
# ceiling on what any router can score here, and the harness refuses a
# `confident: false` that names no alternative.

version: 1


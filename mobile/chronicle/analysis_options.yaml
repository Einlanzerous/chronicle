# Static analysis for the Chronicle Android client. `flutter analyze` is the CI
# gate (.github/workflows/mobile.yml), matching how the estate's other two
# Flutter apps are checked.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by scripts/gen-dartapi.sh and guarded by a byte-comparison in
    # CI. It is analyzed on its own terms (its own analysis_options.yaml comes
    # from the generator); linting it here would mean either editing a generated
    # file or carrying ignore comments the generator would overwrite.
    - packages/chronicle_api/**

linter:
  rules:
    # Every string in this app is either a URL, a wire key or interface copy.
    prefer_single_quotes: true
    # A stray print in a capture app is a log line nobody reads on a device
    # nobody is attached to; the app surfaces state in the UI instead.
    avoid_print: true

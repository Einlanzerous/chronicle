# oapi-codegen configuration for the ASR client. Run through
# scripts/gen-asrclient.sh, never by hand — the flags are the artefact.
#
# Types AND client, in one package: Chronicle's side of the wire. The SERVICE
# holds its own generated copy of the same types, asr/internal/wire, from the
# same file in the same generator run — so a change to asr/openapi.yaml that
# either end has not caught up with is a compile error rather than a field that
# quietly stops being sent. Two copies rather than one shared package because
# nothing under asr/ imports anything outside it (CHRN-82 §2).
package: asrclient
generate:
  models: true
  client: true

# No `output:` here on purpose. The destination is passed with -o by
# scripts/gen-asrclient.sh, because the staleness check in verify.sh has to
# regenerate to a TEMPORARY FILE and compare -- a check that rewrites the file
# it is checking cannot tell you what was committed. An `output:` in this file
# silently wins over -o, which is how that check came to pass against an empty
# temp file the first time it was written.

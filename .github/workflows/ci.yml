name: ci

# Build, test, lint, and the migration staleness guard.
#
# Database-backed tests skip without CHRONICLE_TEST_DATABASE_URL, so a Postgres
# service container provides one. The image tag is PINNED rather than floating
# on 16-alpine: the schema job byte-compares pg_dump output, and pg_dump's
# format can shift between patch releases.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_IMAGE: postgres:16.15-alpine
  # CI-only, for an ephemeral container that never leaves the runner. Real
  # credentials live in Signet and are not needed here.
  PGPW: ci-not-a-secret

jobs:
  verify:
    name: build, vet, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHRONICLE_TEST_DATABASE_URL: postgres://chronicle:ci-not-a-secret@localhost:5432/chronicle_test?sslmode=disable
      # The tier-isolation test connects as the regeneration role to prove it
      # cannot read tier-2 credentials. Without this DSN it skips, which would
      # be a silent hole in the one check the doctrine rests on.
      CHRONICLE_TEST_TIER1_DATABASE_URL: postgres://chronicle_tier1:ci-not-a-secret@localhost:5432/chronicle_test?sslmode=disable
      # The ASR service (CHRN-25) has its own database and its own role, so it
      # has its own DSN. Without it the job tests skip -- including the kill -9
      # lease test, which is the Done-when that cannot be checked by reading.
      ASR_TEST_DATABASE_URL: postgres://asr:ci-not-a-secret@localhost:5432/asr_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The migrations grant to chronicle_tier1, and the tier-isolation test
      # asserts against it, so both roles have to exist before anything runs.
      #
      # asr_test is a SEPARATE DATABASE with a SEPARATE ROLE, mirroring the
      # deployment. Putting the ASR tables in chronicle_test would be cheaper
      # and would quietly make the test suite prove the opposite of what the
      # separate store exists for.
      - name: Provision roles and test databases
        run: |
          docker run --rm --network host -i "$PG_IMAGE" \
            psql "postgres://postgres:${PGPW}@localhost:5432/postgres?sslmode=disable" \
            -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE chronicle LOGIN PASSWORD '${PGPW}';
          CREATE ROLE chronicle_tier1 LOGIN PASSWORD '${PGPW}';
          CREATE ROLE asr LOGIN PASSWORD '${PGPW}';
          CREATE DATABASE chronicle_test OWNER chronicle;
          CREATE DATABASE asr_test OWNER asr;
          SQL

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # internal/asrclient is generated from deploy/asr/openapi.yaml by a
      # generator pinned through go.mod's `tool` directive. Regenerated to a
      # temp file and byte-compared, so the check never rewrites what it is
      # checking. Same guard as the schema job below, for the same reason: a
      # generated artefact with no guard is one somebody hand-edits -- and this
      # one has a second client, in another language, generating from the same
      # file.
      - name: ASR client staleness guard
        run: |
          tmp="$(mktemp -t asrclient.XXXXXX.go)"
          GEN_ASRCLIENT_OUT="$tmp" scripts/gen-asrclient.sh
          if ! diff -u internal/asrclient/client.gen.go "$tmp"; then
            echo "::error file=internal/asrclient/client.gen.go::the generated client does not match deploy/asr/openapi.yaml."
            echo "Run scripts/gen-asrclient.sh and commit the result."
            exit 1
          fi
          echo "internal/asrclient matches the contract."

      - name: Test
        run: go test -race ./... -count=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  schema:
    name: migration staleness guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # schema.sql is generated from the migrations. Regenerate it and require
      # the result to match what is committed. This catches both halves of the
      # drift: a migration added without regenerating, and a hand-edit of the
      # generated file.
      #
      # This is the one place that should still hand the script a DSN: the
      # service container above is this job's own and holds nothing else, and
      # supplying it keeps CHRN-77's guard on the CI path rather than only on
      # the developer path. The guard refuses any server holding a database it
      # did not create, so ADDING A DATABASE TO THE SERVICE CONTAINER ABOVE
      # WILL FAIL THIS JOB. Give the job a second service rather than weakening
      # the check. Run without the DSN and the script brings its own Postgres.
      - name: Regenerate schema.sql
        env:
          SCHEMAGEN_SUPERUSER_DSN: postgres://postgres:ci-not-a-secret@localhost:5432/postgres?sslmode=disable
        run: scripts/gen-schema.sh

      - name: Fail if schema.sql is stale
        run: |
          if ! git diff --exit-code -- schema.sql; then
            echo "::error file=schema.sql::schema.sql does not match the migrations."
            echo "Run scripts/gen-schema.sh and commit the result."
            exit 1
          fi
          echo "schema.sql matches the migrations."

  branch-name:
    name: branch name carries a ticket
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The working agreement wants branches named chrn-NN-description so
      # per-ticket spend attributes correctly. Release-please reads the commit
      # message, not the branch, so nothing here needs a conventional-commit
      # prefix. This NOTICES a branch that does not match; it does not block the
      # merge, because a naming convention is not worth failing a green build
      # over.
      - name: Check
        run: |
          branch="${{ github.head_ref }}"
          if printf '%s' "$branch" | grep -qiE '^chrn-[0-9]+-[a-z0-9._-]+$'; then
            echo "branch '$branch' carries a ticket number."
          else
            echo "::warning::branch '$branch' does not match chrn-NN-description — per-ticket spend will not attribute correctly."
          fi

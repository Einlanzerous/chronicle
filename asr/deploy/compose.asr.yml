# Shared estate ASR service — compose fragment. CHRN-24 (the runner) and
# CHRN-25 (the job contract over it).
#
# NOT a standalone stack: this is the block to paste into
# ~/construct-server/docker-compose.yml, which owns the shared networks and
# Postgres. Kept here so the deploy shape is reviewable in this repo.
#
# Prerequisites, in order:
#   1. asr/deploy/provision-db.sh has run (database `asr` + role `asr` exist)
#   2. ASR_DB_PASSWORD and ASR_CLIENT_TOKENS reach .env out of Signet:
#        signet target add-key --project construct-server \
#          --path /opt/construct-server/.env --name ASR_DB_PASSWORD
#        signet target add-key --project construct-server \
#          --path /opt/construct-server/.env --name ASR_CLIENT_TOKENS
#        signet sync
#   3. The models are on disk somewhere ASR_MODELS_DIR points at.
#
# Half of this fragment is a property of the MACHINE rather than of the service
# — which render node, which group, where the models live — and that half was
# settled by CHRN-24 and is unchanged.

services:
  asr:
    # Published by .github/workflows/publish-asr.yml (CHRN-82). ASR_TAG is
    # pinned at major.minor in construct-server's versions.env like every other
    # first-party image; `latest` is main's tip and is the fallback, not the
    # deployment. The estate PULLS this image — there is no `build:` block
    # here, on purpose, because a compose file that can build is a compose file
    # that quietly runs whatever tree it was last pointed at.
    image: ghcr.io/einlanzerous/estate-asr:${ASR_TAG:-latest}
    container_name: asr
    restart: unless-stopped

    # The image's ENTRYPOINT is whisper-cli, so that CHRN-12's benchmark
    # harness runs through it unmodified and the reference numbers keep
    # comparing to something. The service overrides it here, visibly, in one
    # line rather than by changing what the image is.
    entrypoint: ["/usr/local/bin/asrd"]
    command: ["serve"]

    # No `ports:` on purpose. This is reached container-to-container on
    # construct_net by Chronicle, and later by Catenary. Publishing a port would
    # put a transcription queue on the host for anything that can reach it.
    expose:
      - "4011"

    # renderD129 is the R9700; renderD128 is the CometLake iGPU. Confirmed
    # through /sys/class/drm/*/device/uevent rather than assumed from the
    # numbering, which reads the wrong way round on this box:
    #   renderD128 -> i915   0000:00:02.0
    #   renderD129 -> amdgpu 0000:03:00.0   <- Navi 48
    #
    # Passing only the R9700 means the iGPU is not in the container to be
    # enumerated at all, so GGML_VK_VISIBLE_DEVICES below is a second belt
    # rather than the only thing standing between this and a 20x slower device.
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129

    # The render node is root:render 0660, so a non-root container needs the
    # group. 993 is this host's render gid (getent group render) — it is a
    # host fact, not a portable constant, and it is the first thing to check if
    # the container reports no Vulkan device.
    group_add:
      - "993"

    environment:
      GGML_VK_VISIBLE_DEVICES: "0"

      ASR_PORT: "4011"
      ASR_DATABASE_URL: postgres://asr:${ASR_DB_PASSWORD}@postgres:5432/asr?sslmode=disable

      # `name:token` pairs, out of Signet, never written here. Empty is a BOOT
      # ERROR rather than an open service: client_id is derived from the token
      # and nothing else, because CHRN-26 queues per client for fairness and a
      # client-asserted identity would let either service jump the other's
      # queue.
      ASR_CLIENT_TOKENS: ${ASR_CLIENT_TOKENS}

      ASR_DEFAULT_MODEL: ${ASR_DEFAULT_MODEL:-small.en}

      # CHRN-26. What the advisory lock names, and what lands in leased_by —
      # per DEVICE, never per deployment. A second card is a second value here
      # and not a redesign; two asrd processes naming the SAME device still
      # exclude each other, which is the redeploy case the lock exists for.
      ASR_DEVICE_ID: ${ASR_DEVICE_ID:-r9700}

      # The resident child. Loopback only: whisper-server has no
      # authentication of any kind, so a listener on construct_net that
      # transcribes anything sent to it would make ASR_CLIENT_TOKENS
      # decorative. It is deliberately NOT in `expose:` for the same reason.
      ASR_WHISPER_SERVER_ADDR: 127.0.0.1:8081
      ASR_LOG_LEVEL: ${ASR_LOG_LEVEL:-info}
      ASR_LOG_FORMAT: ${ASR_LOG_FORMAT:-json}

      # Recorded on every result, alongside the model, because a corpus
      # transcribed by two different backends over time is one whose quality
      # varies invisibly.
      ASR_BACKEND: vulkan

    healthcheck:
      # /healthz and not /readyz: an unready service (Postgres restarting) must
      # not be restarted, it must be taken out of rotation. Liveness is the only
      # question a restart is the answer to.
      test: ["CMD", "/usr/local/bin/asrd", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

    depends_on:
      - postgres

    networks:
      - construct_net

    volumes:
      # The model store. Point this at wherever the ggml-*.bin files live; the
      # benchmark rig's copies are under ~/tools/whisper.cpp/models.
      #
      # READ-ONLY, and the service says so at boot if it finds nothing here:
      # with no models every submit is a 400 naming a model the deployment does
      # not have, and nothing in that 400 points at an unmounted volume.
      - ${ASR_MODELS_DIR:-~/tools/whisper.cpp/models}:/opt/whisper/models:ro

networks:
  construct_net:
    external: true

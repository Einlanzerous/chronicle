name: mobile

# The Android client's generated API package (CHRN-59, E9). Scoped to the paths
# that can invalidate it so a server-only PR does not pay for a JDK.
#
# openapi.yaml IS IN THE PATH FILTER, and that is load-bearing rather than
# cautious: mobile/chronicle/packages/chronicle_api is generated from it, so a PR
# that edits the contract alone -- touching nothing under mobile/ -- is exactly
# the PR that makes the committed client stale. Filtering on mobile/** alone
# would let that land green.
#
# The app itself, and the `android` job that analyzes, tests and builds it,
# arrive in the PR stacked on this one. This PR is the client and its guard.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "openapi.yaml"
      - "scripts/gen-dartapi.sh"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "openapi.yaml"
      - "scripts/gen-dartapi.sh"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

env:
  # The same JDK the local toolchain pins (~/dev-tools/env.sh) and the same one
  # the Flutter side will use: Temurin 17. A version skew between CI and the box
  # is a class of "works here, fails there" nobody should debug twice.
  JAVA_VERSION: "17"

jobs:
  # mobile/chronicle/packages/chronicle_api is GENERATED from openapi.yaml by
  # scripts/gen-dartapi.sh (openapi-generator, pinned twice -- the npm launcher
  # in mobile/package.json and the JAR version in mobile/openapitools.json).
  # Regenerated into a temp directory and compared, so the check never rewrites
  # what it is checking.
  #
  # The reason is the one ci.yml gives three times over: a generated artefact
  # with no guard is a generated artefact somebody hand-edits. This document has
  # three OTHER clients besides this one.
  #
  # This guard lives here rather than in verify.sh deliberately. verify.sh is the
  # one command a Go change has to pass, and making it require a JDK and a JAR
  # download to check a Dart package would tax every server-side change for a
  # client it does not touch.
  dart-client:
    name: dart client staleness guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Dart API client staleness guard
        run: |
          tmp="$(mktemp -d -t dartapi.XXXXXX)"
          GEN_DARTAPI_OUT="$tmp" scripts/gen-dartapi.sh
          # The WHOLE tree, with nothing excluded -- verified that a clean
          # checkout compares equal, so an exclusion would only hide a
          # difference. .openapi-generator/FILES lists what the generator wrote
          # and is itself generated, so it is compared too: a file that stops
          # being generated has to stop being committed.
          if ! diff -ur mobile/chronicle/packages/chronicle_api "$tmp"; then
            echo "::error file=mobile/chronicle/packages/chronicle_api::the generated Dart client does not match openapi.yaml."
            echo "Run scripts/gen-dartapi.sh and commit the result."
            exit 1
          fi
          echo "the Dart client matches the contract."

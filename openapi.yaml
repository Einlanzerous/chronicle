# Chronicle's HTTP contract — CHRN-97.
#
# THIS FILE IS THE SOURCE. `internal/api/wire` is generated from it by
# scripts/gen-api.sh, and CI fails when the two disagree. Three clients build
# against it — E8's web client, E9's Android capture, E10's MCP — which is the
# entire reason the contract is a spec rather than a Go package.
#
# The decision behind every shape here is the approved plan on CHRN-97
# (revision 2, eight rulings). Read it before changing anything. The four that
# cost the most to get wrong:
#
#   ruling 1  generation runs toward the SERVER: models + std-http-server, so a
#             path with no handler is a compile error and a handler with no path
#             cannot be registered.
#   ruling 2  every shipped route joins this document. A route that is not here
#             does not exist.
#   ruling 3  a reference RESOLVES ELSEWHERE. A note payload carries reference
#             descriptors and never upstream state, which is what lets a note
#             carry an honest ETag.
#   ruling 6  no /v1 prefix. Two path-keyed Traefik rules in construct-server
#             key on these addresses, and one of them —
#             `chronicle-public-admin` — is what keeps /admin off the WAN host.
#             Moving a path here is an edge change there.
#
# 3.0.3 rather than 3.1, for CHRN-25's reason: oapi-codegen's 3.1 support is
# partial, and a spec the generator half-understands is a generated client that
# silently omits a field.
openapi: 3.0.3

info:
  title: Chronicle
  version: "1.0.0"
  description: |
    Voice-note ingestion into a notes and discussion wiki. A memo is captured,
    transcribed on the shared ASR service, routed by the Scribe into a note, a
    ticket or a discussion, and lands in a corpus that links out to Switchyard
    and Amber rather than absorbing them.

    **Two tiers, and they do not share a store.** Tier 1 is the estate's account
    of what exists — generated, regenerable, never hand-edited. Tier 2 is what a
    person said or wrote — memos, transcripts, notes, discussions — and none of
    it can be rebuilt. They are reached by different code paths through
    different database roles.

    **References are linked, never copied.** A ticket or an Amber item resolves
    at render time and is never written into Chronicle's tables. Resolution
    therefore has its own endpoint: a note payload carries the references its
    text names and nothing an upstream said about them.

servers:
  - url: http://chronicle:4009
    description: construct_net, container-to-container
  - url: https://chronicle.zerogravity.industries
    description: the Access-gated host

# Every operation needs a session unless it says otherwise. The two forms are
# the same credential: `sessionToken` reads the bearer header first and falls
# back to the cookie, so a client may present either.
security:
  - sessionBearer: []
  - sessionCookie: []

tags:
  - name: meta
    description: Liveness and readiness. The only routes with no credential.
  - name: auth
    description: Sessions, invites and the account behind them.
  - name: accounts
    description: Account administration. Owner only, and never an agent.
  - name: uploads
    description: Resumable memo ingest.
  - name: triage
    description: Where derived state becomes authored state.
  - name: storage
    description: What the corpus costs, and whether the disk agrees with the database.
  - name: transcription
    description: How transcription is going, and which memos are stuck.
  - name: references
    description: |
      Turning the references a note names into live cards. Linked, never
      copied: nothing an upstream answers here is ever written to a table.
  - name: pages
    description: The page tree notes are filed under. Addressed by path; identified by id.
  - name: notes
    description: |
      Authored notes and their revisions. Tier 2: what a person wrote,
      rebuildable by nobody. Markdown is stored raw and rendered on read.
  - name: search
    description: Full-text search across notes and transcripts. Not a list.

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness. No dependencies, no credential.
      description: |
        Answers if the process is running. Deliberately free of dependencies: a
        database that is down is not a reason to restart the binary.

        Load-bearing beyond liveness — CHRN-59's QR onboarding probes this to
        check a server address before any credential exists, which is also why
        it keeps an unprefixed path.
      operationId: getHealthz
      security: []
      x-chronicle-policy: public
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [meta]
      summary: Readiness. Pings the database.
      description: |
        Answers whether this process can serve traffic. A load balancer takes an
        unready instance out of rotation; it does not kill it, which is why this
        is a different question from liveness and a different route.
      operationId: getReadyz
      security: []
      x-chronicle-policy: public
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: not ready — a named check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /admin/storage:
    get:
      tags: [storage]
      summary: What the corpus costs, and whether the disk agrees with the database.
      description: |
        CHRN-23's *"a number the service reports rather than one someone runs du
        for"*.

        **A read.** It reports orphans; it never deletes one and never hands the
        pruner a list. Orphans are reported so a person can decide, which is a
        different thing from a job acting on them.

        Counts are exact. The `*_sample` lists are bounded, so a corpus-wide
        problem produces a readable answer rather than a megabyte of JSON.
      operationId: getStorageReport
      x-chronicle-policy: owner
      responses:
        "200":
          description: the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            no audio store is configured. Distinct from an empty report on
            purpose: "no audio configured" and "no audio yet" are different
            facts and must not render the same.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/transcription:
    get:
      tags: [transcription]
      summary: How transcription is going, and which memos are stuck.
      description: |
        The half of CHRN-27's `Done when` a test cannot answer: *"a transcription
        failure leaves the memo in a state a human can see and retry."* A failure
        nobody can see is one nobody retries.

        **A read.** The retry is `chronicle retranscribe`, on the host, because
        re-running transcription costs GPU time on a device three services share
        and that is not an unmetered HTTP verb until CHRN-26 has leased it.
      operationId: getTranscriptionReport
      x-chronicle-policy: owner
      responses:
        "200":
          description: the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: no database is configured, so there is no corpus to report on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── AUTH ────────────────────────────────────────────────────────────────────
  # No passwords. A one-time invite redeems into a durable per-device session,
  # and two sign-in paths mint the same kind of session. Both are credential-
  # free and both are rate-limited: they are the only two unauthenticated
  # endpoints that MINT a credential, and limiting one of them just moves the
  # target.

  /auth/session:
    post:
      tags: [auth]
      summary: Redeem an invite for a session.
      description: |
        How the app and the MCP sign in. The session token is returned here and
        never again; the client stores it and sends it as `Authorization:
        Bearer`, or accepts the cookie.

        A spent, expired or unknown invite is `401` with an identical body,
        indistinguishable on purpose — probing cannot tell a used invite from
        one that never existed.
      operationId: createSession
      security: []
      x-chronicle-policy: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            the invite is spent, expired or unknown — one answer for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [auth]
      summary: Sign out, revoking this session.
      operationId: deleteSession
      x-chronicle-policy: member
      responses:
        "204": { description: signed out; the cookie is cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/sso/cloudflare:
    post:
      tags: [auth]
      summary: Exchange a verified Cloudflare Access identity for a session.
      description: |
        The browser calls this on load: the tunnel injects a
        `Cf-Access-Jwt-Assertion` header, Chronicle verifies it **itself**
        against the JWKS rather than trusting the header the edge injected, and
        a verified email matched to an account mints the same kind of session
        the invite path does.

        **The assertion header is deliberately not declared as a parameter.**
        Declaring it required would make the generated wrapper answer `400` when
        it is absent, where this operation answers `401` with a code saying
        which of "no assertion", "not configured here" and "no such account"
        happened — a distinction a person debugging an SSO wall needs.
      operationId: createSessionFromAccess
      security: []
      x-chronicle-policy: signin
      responses:
        "200":
          description: signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: no assertion, an unverifiable one, or SSO is not configured here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "403":
          description: the assertion verified, and names an email no account holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/me:
    get:
      tags: [auth]
      summary: The account this session belongs to.
      operationId: getMe
      x-chronicle-policy: member
      responses:
        "200":
          description: the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [auth]
      summary: Change your own display name.
      operationId: updateMe
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: the updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/invite:
    post:
      tags: [auth]
      summary: Mint an invite for another of your own devices.
      description: |
        Self-service, so adding a second phone does not need the owner. The
        invite is single-use and short-lived; `sign_in_url` is the QR target and
        is absent when no mobile base URL is configured.
      operationId: createSelfInvite
      x-chronicle-policy: member
      responses:
        "201":
          description: the invite, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/sessions:
    get:
      tags: [auth]
      summary: Your own signed-in devices.
      description: |
        The one real risk in a password-free model: a session does not expire,
        so a lost device stays signed in forever unless its holder can see it
        and cut it off. Hence this list, and the revoke below it.
      operationId: listSessions
      x-chronicle-policy: member
      responses:
        "200":
          description: this account's sessions, the current one marked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke one of your own sessions.
      description: |
        Revoking the session you are calling with is a sign-out, and clears the
        cookie too. Another account's session answers exactly as one that does
        not exist.
      operationId: revokeSession
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: "revoked, or already gone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ── ACCOUNTS ────────────────────────────────────────────────────────────────
  # Owner only, and never an agent. Not served on the WAN host at all:
  # construct-server's `chronicle-public-admin` router blackholes /admin there,
  # because POST /admin/users/{id}/invite mints a live credential and
  # requireOwner alone is not the boundary that should be holding it.

  /admin/users:
    get:
      tags: [accounts]
      summary: Every account, with its devices and invite state.
      operationId: listUsers
      x-chronicle-policy: owner
      responses:
        "200":
          description: the roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [accounts]
      summary: Create an account and mint its first invite.
      operationId: createUser
      x-chronicle-policy: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserRequest"
      responses:
        "201":
          description: the account and its invite, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: that email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}/invite:
    post:
      tags: [accounts]
      summary: Mint a fresh invite for an existing account.
      description: A second device, or a replacement for one never redeemed.
      operationId: createUserInvite
      x-chronicle-policy: owner
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: the invite, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}:
    delete:
      tags: [accounts]
      summary: Remove an account and its credentials.
      description: |
        The owner cannot be removed, and neither can an author the corpus
        references — that answers `409`, because it is a refusal the caller can
        act on rather than a fault. Tier 2 is authored and irreplaceable, so a
        memo keeps the author that recorded it.
      operationId: deleteUser
      x-chronicle-policy: owner
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: the owner account cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: this account has memos and cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  # ── UPLOADS ─────────────────────────────────────────────────────────────────
  # Resumable memo ingest (CHRN-20). Every refusal here is a client-visible
  # answer with a specific remedy, which is why they are enumerated rather than
  # collapsed into 400: a phone deciding whether to resend, wait, or give up
  # needs to tell "we disagree about the offset" from "those were the wrong
  # bytes".
  #
  # `Upload-Offset` is the resume instruction and rides on the RESPONSE of every
  # state-carrying answer, including 409 and 408.

  /memos/uploads:
    post:
      tags: [uploads]
      summary: Declare an upload and open a session for it.
      description: |
        `idempotency_key` is minted per capture and persisted by the client
        BEFORE the request goes out, so an HTTP retry is a replay rather than a
        second memo. A replay — same key, same declaration — answers `200` with
        the existing session; a mismatch answers `409` and the client mints a
        fresh key.
      operationId: openUpload
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenUploadRequest"
      responses:
        "200":
          description: a replay of an upload already open
          headers:
            Upload-Offset: { $ref: "#/components/headers/UploadOffset" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadState"
        "201":
          description: opened
          headers:
            Upload-Offset: { $ref: "#/components/headers/UploadOffset" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadState"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/UploadConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/UploadsUnconfigured" }

  /memos/uploads/{id}:
    get:
      tags: [uploads]
      summary: Where this upload got to.
      description: |
        **This can finalise.** `Status` completes an upload whose bytes are all
        present, which is what makes a client's "where did I get to" call safe
        after a restart that landed the last chunk and died before committing —
        and it means this read answers the same refusals the append does. A
        client polling here needs the 409 and 422 branches as much as one
        sending bytes.
      operationId: getUpload
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: the session's state, or the memo if this call completed it
          headers:
            Upload-Offset: { $ref: "#/components/headers/UploadOffset" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadState"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UploadConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/UploadsUnconfigured" }

    patch:
      tags: [uploads]
      summary: Append a chunk.
      description: |
        The body is raw bytes, not a form part and not base64 — that costs a
        third of the bytes and forces both ends to hold the whole thing in
        memory.

        **A chunk must carry a `Content-Length`**; a chunked body is refused,
        because the offset arithmetic this endpoint is built on needs to know
        the length before it reads. The last chunk completing the declared size
        finalises the memo and returns it.
      operationId: appendChunk
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Offset
          in: header
          required: true
          description: The offset these bytes start at. A disagreement answers 409 carrying the server's.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: accepted; the memo is present once the upload completes
          headers:
            Upload-Offset: { $ref: "#/components/headers/UploadOffset" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadState"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/TransferCut" }
        "409": { $ref: "#/components/responses/UploadConflict" }
        "411":
          description: |
            no `Content-Length`. A chunked body cannot be accepted here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/UploadsUnconfigured" }

    delete:
      tags: [uploads]
      summary: Abandon an upload and discard its staged bytes.
      operationId: abandonUpload
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "204": { description: "abandoned, or already gone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/UploadsUnconfigured" }

  # ── TRIAGE ──────────────────────────────────────────────────────────────────
  # CHRN-33's surface, and THE ONE PLACE DERIVED STATE BECOMES AUTHORED STATE.
  # The Scribe proposes; a person confirms; the confirmation is what writes tier
  # 2. Every payload below is shaped by that: a proposal is always accompanied
  # by what it was derived from, a decision always names the generation it was
  # made against, and a result never reports a batch-wide status.
  #
  # requireUser and not requireOwner on the five: every account triages its own
  # memos, and the author scoping is applied inside the service PER ITEM on the
  # POST as well as on the GET — a list that merely hides a memo is not access
  # control, because a client naming an id directly never went through the list.

  /triage/batch:
    get:
      tags: [triage]
      summary: The next memos awaiting a decision, with their proposals.
      description: |
        Batch-first because the real pattern is an evening pass over a day's
        memos, not a notification per capture.
      operationId: getTriageBatch
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: the batch, and the cap it was clamped to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageBatch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  /triage/accept:
    post:
      tags: [triage]
      summary: Confirm a batch of decisions.
      description: |
        **This is the write.** Each item carries the `generation` it was decided
        against, so a proposal that has been regenerated since the client read
        it is refused rather than confirmed against text nobody saw.

        There is no batch-wide status and there must not be: the interesting
        case is item 7 of 12 failing, and a single status could not say which
        one to re-show.
      operationId: acceptTriage
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRequest"
      responses:
        "200":
          description: one result per item, IN REQUEST ORDER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResults"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  /triage/hold:
    post:
      tags: [triage]
      summary: Defer a memo — "not now".
      description: |
        CHRN-34's escape. Most deferrals are "not now"; the ones that are not
        are the ones still legible in three weeks, which is why `reason` exists
        and is optional.

        Holding somebody else's memo answers exactly as holding one that does
        not exist.
      operationId: holdMemo
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldRequest"
      responses:
        "200":
          description: the deferred item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferredItem"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            this memo is not in a state that can be deferred — it has already
            been decided, or is already held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  /triage/release:
    post:
      tags: [triage]
      summary: Bring a deferred memo back into the batch.
      operationId: releaseMemo
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "204": { description: released }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  /triage/deferred:
    get:
      tags: [triage]
      summary: What this account has deferred, oldest first.
      description: |
        Carries `age_seconds` rather than only `held_at`, because the question
        being asked is "how long has this been waiting" and a client computing
        it from two clocks would get a different answer from the server's.
      operationId: listDeferred
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: the deferred memos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferredList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  /admin/triage:
    get:
      tags: [triage]
      summary: What triage left behind — the backlog by age, and the decisions that did not finish landing.
      description: |
        Owner only, because it spans every author's corpus.

        The four link states are the point. A decision writes tier 2 and then
        reaches Switchyard, and every gap between those two is a state a person
        has to be able to see: `in_flight` is still going, `unresolved` never
        arrived, `ambiguous` found more than one candidate, and `refused` was
        answered no. None of them is a fault the service can fix on its own,
        which is why they are reported rather than retried silently.
      operationId: getTriageReport
      x-chronicle-policy: owner
      responses:
        "200":
          description: the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageReport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TriageUnconfigured" }

  # ── REFERENCES ──────────────────────────────────────────────────────────────
  # The second phase of the two-phase render CHRN-97 ruling 3 picked. A note
  # read (CHRN-98) hands back the descriptors its text produced and no upstream
  # state at all; a client batches whichever of them it wants drawn as cards to
  # this endpoint and gets one CHRN-51 Resolution each (CHRN-104).
  #
  # NOTHING HERE IS STORED. Switchyard and Amber are linked, never copied
  # (CLAUDE.md invariant 2): the resolver's sixty-second cache dies with the
  # process, and every answer carries the instant it was true.

  /references/resolve:
    post:
      tags: [references]
      summary: Resolve a batch of references into live cards.
      description: |
        Takes the descriptors a note payload handed out and answers one
        resolution per descriptor, **keyed on `token`** — a token is unique
        within one scan's output, so a client aligns answers without depending
        on order. Order is preserved anyway.

        **The server re-derives every descriptor from its `token`** (CHRN-97
        ruling 8). `system`, `key`, `target` and `number` are parsed from the
        token under the same grammar that produced them, and a descriptor that
        disagrees with the grammar is refused with `400`. The one thing a
        client may not choose is which upstream gets dialled: this is the one
        code path in the design that leaves the process.

        **Chronicle's own `CHR-` and `DSC-` references never leave the
        process.** They resolve against the notes and discussions tables — no
        network, no staleness. A soft-deleted note answers `broken` with
        `outcome: deleted`, no title and no URL.

        **This endpoint parses tokens; it does not scan documents, and it never
        feeds the miss feed.** Whoever scans owns that — the note handler — and
        a second caller would make one dead key in one note log twice per page
        render.

        At most 50 descriptors per call, which is CHRN-51's cap: a larger batch
        could never be checked in one render, so it is refused rather than
        silently truncated.
      operationId: resolveReferences
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: one resolution per descriptor, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: |
            the body is malformed, empty or over the cap — or a descriptor
            disagrees with its own token. `invalid_reference` is a token the
            grammar does not recognise as a reference at all;
            `reference_mismatch` is a descriptor whose `system`, `key`,
            `target` or `number` is not what its token parses to. Both name
            the offending position and neither echoes the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ReferencesUnconfigured" }

  # ── PAGES ───────────────────────────────────────────────────────────────────
  # CHRN-37's tree, reachable (CHRN-98). Pages are addressed by PATH and
  # identified by id, and those are two different things on purpose: a move
  # changes the first and never the second, which is what lets a note survive
  # one. The path is derived from ancestry, never stored, so nothing here can
  # hand back a stale one.

  /pages:
    get:
      tags: [pages]
      summary: The whole page tree, as sorted paths.
      description: |
        Every page's current path, sorted. A tree is a property of the paths
        — `estate` is the parent of `estate/conventions` — so this is the tree,
        and a client renders it however it likes. Bounded by the corpus, which
        is a few hundred pages at most, so it is not paginated.
      operationId: listPages
      x-chronicle-policy: member
      responses:
        "200":
          description: the tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTree"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

    post:
      tags: [pages]
      summary: Create a page at a path.
      description: |
        The parent must already exist and is resolved WITHOUT following
        redirects: a caller writing to a path needs to know it is writing where
        it thinks it is. A single-segment path creates a root page.

        Here because nothing else creates one: a note must be filed on a page,
        and until this operation a fresh deployment had no page to file it on.

        An agent session may create a page. A page is a container and carries
        no authored text and no confirming person; the person-only rule
        (CH041) is about revisions, and it holds where they are written.
      operationId: createPage
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPageRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: the parent path names no page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a sibling already uses that slug — two rows would claim one path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

  # ── NOTES ───────────────────────────────────────────────────────────────────
  # E5's store, reachable (CHRN-98). Three things are decided upstream and only
  # transcribed here:
  #
  #   ruling 3  a note payload carries the reference DESCRIPTORS its text
  #             produced and no upstream state. Resolution is
  #             POST /references/resolve. A note read dials nothing.
  #   ruling 4  a soft-deleted note answers 410 with a tombstone — ref,
  #             deleted_at, deleted_by — and no title and no body.
  #   ruling 5  a read carries an ETag of its current revision id and honours
  #             If-None-Match; an append never carries If-Match, because
  #             nothing is overwritten and there is no lost update to prevent.
  #
  # And one rule with exactly one caller: the note handler is the one that
  # SCANS, so it is the one that feeds the miss feed. Nothing else does.

  /notes:
    get:
      tags: [notes]
      summary: The live notes filed on a page.
      description: |
        Soft-deleted notes are excluded, by the store rather than by this
        handler, so a delete cannot be forgotten by one read surface.

        `page` follows a redirect left by a move: a client holding an old path
        still gets the page, and `moved_from` says the path it asked for is no
        longer the page's own. Paginated by cursor over the note number, which
        is append-only.
      operationId: listNotes
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/PagePath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: the notes, oldest number first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: no page at that path, live or redirected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

    post:
      tags: [notes]
      summary: Create a note, as the authenticated person.
      description: |
        The session's account is the author AND the confirming person. The
        store refuses a confirmer that is an agent (`note_revisions_guard`,
        CH041); this operation passes the account through and does not work
        around the guard, so an agent session answers `403`.

        The page is resolved WITHOUT following redirects, for the reason
        `createPage` gives.
      operationId: createNote
      x-chronicle-policy: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNoteRequest"
      responses:
        "201":
          description: the note, as `getNote` would return it
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PersonRequired" }
        "404":
          description: the page path names no page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

  /notes/{ref}:
    get:
      tags: [notes]
      summary: A note, rendered, with the references its text names.
      description: |
        **A pure tier-2 read.** `html` is the current body rendered; `references`
        are the descriptors the scan produced, and nothing an upstream said
        about them — batch them to `POST /references/resolve` for cards. No
        upstream is dialled, which is what lets the `ETag` mean what it says.

        The `ETag` is the current revision id. Send it back as `If-None-Match`
        and an unchanged note answers `304` with no body.

        A soft-deleted note answers `410` with a tombstone: the note existed,
        it was withdrawn, and by whom and when — and no title and no body. A
        client holding a link can tell *withdrawn* from *never existed*, which
        is what CHRN-39's journal is for; undelete makes the same URL answer
        `200` again.
      operationId: getNote
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/NoteRef"
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the last read. A match answers `304`.
          schema:
            type: string
      responses:
        "200":
          description: the note
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "304":
          description: unchanged since the revision `If-None-Match` named
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

  /notes/{ref}/revisions:
    get:
      tags: [notes]
      summary: A note's history, oldest first, with each revision's text.
      description: |
        Raw markdown per revision, not rendered: history is what was written,
        and rendering every revision would scan every revision. Paginated by
        cursor over `seq`, which only ever grows — a restore APPENDS the old
        text as a new revision rather than moving the pointer back, so this
        list is a complete account of what was displayed and when.
      operationId: listNoteRevisions
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/NoteRef"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: the revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

    post:
      tags: [notes]
      summary: Append a revision.
      description: |
        **Always appends. Nothing is overwritten**, so there is no `If-Match`
        and no `412`: two people appending from the same base produce two
        revisions, both in history, the second current. The response says which
        revision this append produced and which one was current when the
        request was read — a gap between `followed.seq` and `revision.seq`
        means somebody else appended in between, which is E8's to render
        ("someone else appended while you were typing") rather than the
        server's to refuse.

        The session's account confirms the text; an agent session answers
        `403`. A title omitted keeps the current one — a rename is a revision
        exactly as an edit is.
      operationId: appendRevision
      x-chronicle-policy: member
      parameters:
        - $ref: "#/components/parameters/NoteRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendRevisionRequest"
      responses:
        "201":
          description: appended
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PersonRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

  # ── SEARCH ──────────────────────────────────────────────────────────────────
  /search:
    get:
      tags: [search]
      summary: Full-text search across notes and transcripts.
      description: |
        **Not a list.** Rank-ordered, and the ranks move as the corpus moves,
        so a cursor over this order would be a lie with a shape. It takes
        `limit`, answers the top N, and carries no cursor.

        Transcripts are searched as well as notes because audio is pruned at
        thirty days: from day thirty-one the transcript is the only account of
        what somebody said, and a search over notes alone would find the small
        fraction of the corpus that got triaged. Each hit says which it is —
        what a person decided to write down and what they happened to say into
        a phone are different facts.

        The query language is Postgres `websearch_to_tsquery`: bare words are
        ANDed, "quoted phrases" are phrases, `OR` is OR, a leading `-` excludes.

        **Owner only, because the transcript half spans every author's
        memos** — including ones never triaged — and the store's query takes
        no actor. This API refuses that elsewhere: "a list that merely hides a
        memo is not access control", which is why `GET /admin/triage` is owner
        too. The same rule holds here rather than being crossed unstated. A
        member-visible search scoped to the caller's own transcripts beside the
        shared notes is a store query this ticket raised rather than added.
      operationId: search
      x-chronicle-policy: owner
      parameters:
        - name: q
          in: query
          required: true
          description: The query. One made only of punctuation matches nothing and is refused as an empty question rather than answered as an empty corpus.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: the top hits, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/WikiUnconfigured" }

components:
  securitySchemes:
    # ONE credential, two ways of presenting it. `sessionToken` reads the
    # Authorization header first and falls back to the cookie, so an operation
    # accepting one accepts the other and the document says so with two
    # alternative requirements rather than by picking a favourite.
    sessionBearer:
      type: http
      scheme: bearer
      description: A session token minted by POST /auth/session or a redeemed invite.
    sessionCookie:
      type: apiKey
      in: cookie
      name: chronicle_session
      description: |
        The same token, set as an HttpOnly cookie by the sign-in routes. What
        the web client uses; an XSS cannot read it.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: |
        How many to return. CLAMPED SERVER-SIDE, never refused: a triage batch
        caps at 25 and echoes the cap, `search` caps at 100 and echoes it, and
        the note and revision lists cap at 200 and say so by answering a
        `next_cursor` for the rest. A client asking for more than the cap gets
        the cap.
      schema:
        type: integer
        minimum: 1
    NoteRef:
      name: ref
      in: path
      required: true
      description: |
        A note reference, parsed leniently — `CHR-0311`, `chr-311` and
        `CHR-00311` all name note 311 — because people quote these by hand.
        Rendered strictly everywhere in a payload, as `CHR-0311`.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque; the `next_cursor` of the previous page. Absent means the
        start. Never an offset: every list here is over an append-only table,
        and an offset silently repeats and skips rows as new ones land.
      schema:
        type: string
    PagePath:
      name: page
      in: query
      required: true
      description: A page path, `estate/conventions/naming`. A redirect left by a move is followed.
      schema:
        type: string
        minLength: 1
    SessionId:
      name: id
      in: path
      required: true
      description: A session's id, from GET /auth/sessions.
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    ETag:
      description: |
        The note's current revision id, quoted. Send it back as
        `If-None-Match`. It changes when and only when a revision is appended,
        because the payload carries nothing else that can change — no upstream
        state, by ruling 3.
      required: true
      schema:
        type: string
    UploadOffset:
      description: |
        How many bytes the server holds. On a 409 or a 408 this is the resume
        instruction — the offset to send from next — which is why those answers
        carry it rather than only the successful ones.
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: |
        a parameter or a field is missing or malformed. The `code` carries the
        machine-readable part; the message stays flat rather than describing the
        value it rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        no such thing, for this caller. Another account's row answers this too —
        a list that merely hides a row is not access control.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: the request body is larger than this endpoint accepts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: |
        the wrong `Content-Type`. On the JSON routes this is what closes login
        CSRF: a cross-site form cannot produce `application/json`, so the check
        is a security control rather than pedantry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: too many attempts; slow down
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: |
        the request was understood and refused on its content — the bytes did
        not match `content_hash`, or more were sent than were declared.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadConflict:
      description: |
        A disagreement the client can act on. **Two shapes, because there are
        two different answers**, and conflating them is how a client ends up
        retrying something that can never work:

        - **Resume.** An offset mismatch, or staging lost — the session is
          alive and these are instructions for continuing it. The body is an
          `UploadState` and `Upload-Offset` says where to send from.
        - **Mint a new key.** A reused `idempotency_key` presented with a
          different declaration. There is no session to describe and nothing to
          resume; the body is an `Error` with code `idempotency_key_reused` and
          there is no `Upload-Offset`.

        **Tell them apart by which field is present** — `status` on the first,
        `code` on the second. They are disjoint, and a client that reads the
        second as the first sees `offset: 0` on a refusal meaning *this key can
        never work again*, which reads exactly like a live session holding
        nothing.

        3.0.3 cannot give one status two response objects, so this is a `oneOf`
        rather than two entries. Giving key reuse a status of its own was the
        alternative and was refused: 409 is the correct code for both — a
        conflict with the current state of the resource — and moving one of
        them to a less accurate status to make the document simpler would be
        the document lying for its own convenience.
      headers:
        Upload-Offset:
          description: |
            Where to resume from. Present on the resume shape and ABSENT on the
            key-reuse one, which is why this is not required here while the
            same header is required on the 200, 201 and 408.
          required: false
          schema:
            type: integer
            format: int64
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/UploadState"
              - $ref: "#/components/schemas/Error"
    TransferCut:
      description: |
        the connection dropped mid-chunk. **Not a fault**: it is the ordinary
        event this endpoint was built for, and the bytes that landed were kept,
        so this is a resume instruction carrying the new offset. Answering 500
        here made every phone that lost signal emit a line indistinguishable
        from a real failure.
      headers:
        Upload-Offset: { $ref: "#/components/headers/UploadOffset" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadState"
    TriageUnconfigured:
      description: |
        routing is not configured on this deployment. 503 and not 404, on the
        rule this API states in four places — and the message names the
        variables that turn it on, because an operator reading "not found" has
        nowhere to go.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadsUnconfigured:
      description: |
        this deployment has no audio store, so there is nowhere to put a memo.
        503 and not 404, on the rule this API states in four places: "not
        configured here" and "wrong URL" are different facts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: |
        the note was soft-deleted. The tombstone says by whom and when, and
        deliberately nothing else — no title, no body. Undelete makes the same
        URL answer 200 again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NoteTombstone"
    PersonRequired:
      description: |
        the session belongs to an agent, and authored text needs a confirming
        person. `note_revisions_guard` (CH041) refuses the write in the store;
        this is that refusal, answered before the round trip where the kind is
        already known and by the store where it is not.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WikiUnconfigured:
      description: |
        this router was assembled with no notes store behind it. `serve` always
        supplies one, so no deployment reaches this; declared because the
        handler answers it, and driven by the test that builds the router
        without one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReferencesUnconfigured:
      description: |
        this router was assembled with no reference resolver behind it.
        `serve` always supplies one — a Chronicle with neither upstream
        configured still resolves its own notes and answers `unconfigured` for
        the rest, which is a true thing to say — so no deployment reaches
        this. It is declared because the handler answers it, and a declared
        status that no test drives is the one kind of drift `Conform` cannot
        see; the test that drives it builds the router without one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: no session, or one this deployment does not know
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: a valid session, on an account that may not do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: |
        something failed that the caller cannot act on. The detail is in the
        log and deliberately not in this body, which may cross the WAN.

        **Every credentialed operation declares this, and the reason is not
        that every handler has a bug.** `requireUser` resolves the session
        against the database, so a dropped connection answers here on ANY route
        behind a credential — the shared wrapper's 500, not the handler's. A
        document that omitted it would leave three generated clients with no
        branch for the answer they get when Postgres blinks.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # THE ERROR SHAPE, ONCE. Two required fields, matching what the ASR service
    # already publishes (asr/openapi.yaml) so the estate has one error envelope
    # rather than one per service.
    #
    # `code` is the stable machine token and is what a client branches on.
    # `message` is the sentence a person reads and may change without notice.
    # Nothing else: a details bag is where a handler leaks the shape of the id
    # space one field at a time.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable machine token. Clients branch on this, never on `message`.
          example: owner_only
        message:
          type: string
          description: One sentence, for a person. Not stable across releases.

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        commit:
          type: string
          description: Absent on a build that was not stamped with one.

    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unready]
        check:
          type: string
          description: |
            Which dependency failed. Present only on `unready`, and naming the
            check rather than the error: the detail belongs in the log, not in a
            body that may cross the WAN.
          example: database

    StorageReport:
      type: object
      required: [root, disk, corpus, window, reconciliation]
      properties:
        root:
          type: string
          description: The audio store's root on disk.
        disk:
          $ref: "#/components/schemas/DiskReport"
        corpus:
          $ref: "#/components/schemas/CorpusReport"
        window:
          $ref: "#/components/schemas/WindowReport"
        reconciliation:
          $ref: "#/components/schemas/ReconciliationReport"

    DiskReport:
      type: object
      required:
        [files, bytes, strays, stray_bytes, staging, staging_bytes,
         volume_known, volume_total_bytes, volume_free_bytes]
      properties:
        files:
          type: integer
        bytes:
          type: integer
          format: int64
        strays:
          type: integer
          description: Files under the root that this layout did not write.
        stray_bytes:
          type: integer
          format: int64
        stray_sample:
          type: array
          description: |
            A sample of the stray paths. Strays are never counted as corpus and
            never offered to the pruner.
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        staging:
          type: integer
          description: |
            Uploads in flight (CHRN-20) — files this service wrote and
            understands, which are not recordings yet and may never become any.
            Reported apart from both corpus and strays: counted as corpus it
            would inflate what the memos cost, and counted as strays every phone
            mid-upload would read as a file nobody can name.
        staging_bytes:
          type: integer
          format: int64
        volume_known:
          type: boolean
          description: |
            Whether the volume figures below were measurable. It is what
            separates "not measured" from "measured as zero" — a full volume has
            `volume_free_bytes: 0`, which is exactly when the figure matters
            most, so neither number is ever omitted.
        volume_total_bytes:
          type: integer
          format: int64
        volume_free_bytes:
          type: integer
          format: int64

    CorpusReport:
      type: object
      required:
        [memos, audio_present, audio_pruned, recorded_bytes, ever_bytes,
         oldest_capture, newest_capture]
      properties:
        memos:
          type: integer
          format: int64
        audio_present:
          type: integer
          format: int64
        audio_pruned:
          type: integer
          format: int64
        recorded_bytes:
          type: integer
          format: int64
        ever_bytes:
          type: integer
          format: int64
        oldest_capture:
          type: string
          format: date-time
          nullable: true
          description: Null on an empty corpus. Always present, so absent never means empty.
        newest_capture:
          type: string
          format: date-time
          nullable: true

    WindowReport:
      type: object
      required: [days, memos, bytes, projected_bytes, pct_of_projected]
      properties:
        days:
          type: integer
        memos:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        projected_bytes:
          type: integer
          format: int64
          description: What the sizing in docs/benchmarks projected for this window.
        pct_of_projected:
          type: number
          format: double

    ReconciliationReport:
      type: object
      required:
        [orphans, orphan_bytes, missing, missing_bytes, mismatched]
      properties:
        orphans:
          type: integer
          description: Audio on disk that no memo claims.
        orphan_bytes:
          type: integer
          format: int64
        orphan_sample:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        missing:
          type: integer
          description: |
            **The direction that matters.** A memo says its audio is present and
            the file is not there. Non-zero here is the unrecoverable loss
            CLAUDE.md names as the worst thing this system can do, and it leaves
            a log line whether or not anybody reads this response.
        missing_bytes:
          type: integer
          format: int64
        missing_sample:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        mismatched:
          type: integer
        mismatched_sample:
          type: array
          description: |
            Carries both sizes. Without them a 5-against-4096 truncation and a
            4097-against-4096 rounding read identically, and those are not the
            same finding.
          items:
            $ref: "#/components/schemas/Mismatch"
          x-go-type-skip-optional-pointer: true

    Mismatch:
      type: object
      required: [ref, on_disk_bytes, recorded_bytes]
      properties:
        ref:
          type: string
          description: "`<author-id>/<content-hash>`."
        on_disk_bytes:
          type: integer
          format: int64
        recorded_bytes:
          type: integer
          format: int64

    TranscriptionReport:
      type: object
      required: [states, pending, held, partial, enabled]
      properties:
        states:
          type: object
          description: |
            Every memo counted by state, not only the interesting ones. A report
            naming only `held` could not tell "nothing is wrong" from "nothing
            is happening", and a pump that has silently stopped looks exactly
            like a corpus with no failures.
          additionalProperties:
            type: integer
            format: int64
        pending:
          type: integer
          format: int64
          description: |
            Captured, queued and transcribing together. One number, because "how
            far behind is it" is the question being asked.
        held:
          type: integer
          format: int64
        held_sample:
          type: array
          items:
            $ref: "#/components/schemas/HeldMemo"
          x-go-type-skip-optional-pointer: true
        partial:
          type: integer
          format: int64
          description: |
            Memos whose only transcript is incomplete. Reported because they are
            otherwise INVISIBLE: a partial memo is `transcribed`, so nothing
            sweeps it; it is not `held`, so `chronicle retranscribe` will not
            release it; and its audio correctly does not prune. Every one of
            those is right, and together they make a partial memo read as a
            healthy one.
        partial_sample:
          type: array
          items:
            $ref: "#/components/schemas/PartialTranscript"
          x-go-type-skip-optional-pointer: true
        enabled:
          type: boolean
          description: |
            Whether a transcription pump is configured at all. Without it, an
            operator reading `pending: 812` cannot tell a backlog from a service
            that was never pointed at an ASR endpoint — and those want
            completely different remedies.

    HeldMemo:
      type: object
      required: [id, author_id, captured_at, reason, retry]
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        captured_at:
          type: string
          format: date-time
        reason:
          type: string
        retry:
          type: string
          description: The exact command that releases this memo.

    PartialTranscript:
      type: object
      required: [memo_id, model, transcribed_at]
      properties:
        memo_id:
          type: string
          format: uuid
        model:
          type: string
          description: Runner-qualified, e.g. `whisper.cpp/small.en`.
        transcribed_at:
          type: string
          format: date-time

    SsoError:
      type: object
      description: |
        The Access path's error, which carries one field more than the shared
        envelope: the **email the assertion named**. Without it a person facing
        an SSO wall cannot tell which identity was rejected, and that is the
        whole question they have.

        `code` rather than `error`: the handler's own vocabulary has always
        called it a code, and two names for one concept in one document is the
        drift this contract exists to remove.
      required: [code, message]
      properties:
        code:
          type: string
          example: no_account
        message:
          type: string
        email:
          type: string
          description: The verified email the assertion named. Absent when there was no assertion to read.

    SignInRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: A single-use invite token.
        device_label:
          type: string
          description: |
            What this device is called in the session list its holder reads.
            Optional, and bounded — it reaches a TEXT column with no length of
            its own.

    UpdateMeRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string

    NewUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Also the Access identity this account is matched to on SSO.
        display_name:
          type: string
        kind:
          type: string
          description: |
            `person` or `agent`. An agent account can hold a token but is never
            an owner and never confirms authored text — `note_revisions_guard`
            refuses any revision whose `confirmed_by` names one.

    User:
      type: object
      description: |
        An account, as the wire carries it. It deliberately holds **no token
        material**: a credential is returned exactly once, by the call that
        mints it.
      required: [id, email, display_name, kind, is_owner]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        kind: { type: string }
        is_owner: { type: boolean }

    Member:
      description: |
        An account with what the owner needs to administer it. `last_seen_at`
        null and `invite_expires_at` set is an invite never redeemed.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [last_seen_at, invite_expires_at, session_count]
          properties:
            last_seen_at:
              type: string
              format: date-time
              nullable: true
            invite_expires_at:
              type: string
              format: date-time
              nullable: true
            session_count:
              type: integer

    Session:
      type: object
      description: |
        A signed-in session. `session_token` is shown HERE AND NEVER AGAIN —
        there is no endpoint that returns it a second time, because it is stored
        hashed.
      required: [user, session_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session_token:
          type: string

    Invite:
      type: object
      description: |
        A single-use invite, shown once. `sign_in_url` is the QR target and is
        absent when this deployment has no mobile base URL configured — a link
        built from the Access-gated host would walk a phone into an SSO wall a
        bearer token cannot open.
      required: [user, invite_token, expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        invite_token:
          type: string
        sign_in_url:
          type: string
        expires_in:
          type: string
          description: How long the invite is good for, as a Go duration string.
          example: 24h0m0s

    DeviceSession:
      type: object
      required: [id, device_label, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        device_label: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        current:
          type: boolean
          description: |
            Whether this is the session making the request. What lets a person
            revoke every device but the one in their hand.

    OpenUploadRequest:
      type: object
      required: [idempotency_key, content_hash, byte_size]
      properties:
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 200
          description: |
            Minted per capture and persisted by the client BEFORE the request
            goes out, so an HTTP retry is a replay rather than a second memo.
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of the file, lowercase hex. Checked on completion: bytes
            that do not match it are discarded rather than stored as a memo
            nobody can verify.
        byte_size:
          type: integer
          format: int64
          minimum: 1
        retention:
          type: string
          enum: [discard_now, days_30, forever]
          description: |
            Omitted means the deployment default. `days_30` is pruned by policy
            once a durable transcript exists — never on the calendar alone,
            because pruning audio whose transcription never succeeded is
            unrecoverable loss with no user-visible warning.
        original_filename:
          type: string

    UploadState:
      type: object
      description: |
        Where an upload got to. The same shape answers the successful cases and
        every answer that carries a RESUME INSTRUCTION — the 408, and the half
        of the 409 that means "continue from here" — so a client has one thing
        to parse for everything it can act on by sending more bytes.

        The other half of that 409 is an `Error`: a reused key has no session to
        describe. See the `UploadConflict` response.
      required: [status, byte_size, offset, duplicate]
      properties:
        status:
          type: string
          description: |
            `incomplete` — more bytes are expected, and `offset` says from
            where. `complete` — `memo` is set and there is no session left to
            name. There is no third member: a freshly opened session is
            `incomplete` with `offset: 0`, because "opened" and "opened and
            nothing received" are the same fact and a client that had to tell
            them apart would be switching on a distinction the server does not
            make.
          enum: [incomplete, complete]
        upload_id:
          type: string
        byte_size:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: How many bytes the server holds. Send from here next.
        expires_at:
          type: string
          format: date-time
        memo:
          $ref: "#/components/schemas/Memo"
        duplicate:
          type: boolean
          description: |
            Whether this declaration matched a memo that already exists. A
            replay is a success, not a conflict.

    Memo:
      type: object
      description: |
        A captured recording. **Tier 2**: what a person said, derivable from
        nothing, rebuildable by nobody.
      required: [id, state, retention, content_hash, byte_size, captured_at, audio_pruned, retention_status, prunes_at, duration_ms, codec, sample_rate_hz]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          description: captured, queued, transcribing, transcribed, held, discarded.
        retention:
          type: string
          enum: [discard_now, days_30, forever]
        content_hash: { type: string }
        byte_size: { type: integer, format: int64 }
        captured_at: { type: string, format: date-time }
        audio_pruned:
          type: boolean
          description: |
            The recording is gone and the transcript remains. Never true without
            a durable transcript — that predicate, not the calendar, is what
            gates deletion.
        retention_status:
          type: string
          description: What will happen to this memo's audio — the same clause the pruner sweeps with.
        prunes_at:
          type: string
          format: date-time
          nullable: true
          description: When, on that clause. Null when nothing will prune it.
        duration_ms:
          type: integer
          format: int32
          nullable: true
          description: Null until something has decoded the file; a declaration is not a measurement.
        codec:
          type: string
          nullable: true
        sample_rate_hz:
          type: integer
          format: int32
          nullable: true
        original_filename:
          type: string

    # ── TRIAGE ──────────────────────────────────────────────────────────────
    # These are CHRN-32's and CHRN-33's contracts transcribed, not redesigned.
    # A field that looks redundant here usually is not: the pair of "what the
    # Scribe proposed" and "what it was derived from" is what lets a person
    # confirm a decision rather than rubber-stamp one.

    TriageBatch:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BatchItem"
        limit:
          type: integer
          description: |
            The cap this batch was clamped to, echoed because THE POST IS CAPPED
            AT IT and the number asked for may not be the one granted.

    BatchItem:
      type: object
      description: One memo awaiting a decision, with everything needed to make it.
      required: [memo_id, captured_at, excerpt, proposer, generation, status, pre_acceptable]
      properties:
        memo_id: { type: string, format: uuid }
        captured_at: { type: string, format: date-time }
        duration_ms:
          type: integer
          format: int32
        excerpt:
          type: string
          description: |
            The transcript, bounded. **The evidence for the proposal**, and the
            reason this is not a notification with a verb on it: a person
            confirming a routing decision is confirming it against what was
            said, not against a label.
        proposer:
          type: string
          description: Which model proposed, runner-qualified.
        generation:
          type: integer
          nullable: true
          description: |
            Which generation of the proposal this is. A decision carries it back
            so that a proposal regenerated since the client read it is REFUSED
            rather than confirmed against text nobody saw. Null when there is no
            proposal to be a generation of.
        status:
          type: string
          description: |
            Where this memo is in routing — `proposed`, `needs_input`,
            `pre_acceptable`, and the error states. Not the memo's own state.
        proposal:
          $ref: "#/components/schemas/Proposal"
        cleared_fields:
          type: array
          description: |
            Fields the Scribe proposed and the validator REMOVED, each with why.
            Reported rather than dropped: a silently-cleared `project_key` is a
            ticket filed against nothing, and the person confirming is the only
            one who can tell whether the clearing was right.
          items:
            $ref: "#/components/schemas/ClearedField"
          x-go-type-skip-optional-pointer: true
        error:
          type: string
          description: Why this memo has no usable proposal, when it has none.
        pre_acceptable:
          type: boolean
          description: |
            Whether this proposal clears CHRN-36's confidence threshold — the
            one a run of the eval set chose. It is a hint for the UI's default,
            never a licence to skip the confirmation.
        link:
          $ref: "#/components/schemas/LinkState"

    Proposal:
      type: object
      description: |
        What the Scribe proposed. **Derived, disposable, and never authored
        state** — it becomes tier 2 only when a person confirms it, which is the
        whole of CHRN-32's contract.
      required: [destination, confidence, reason, nearest_page]
      properties:
        destination:
          type: string
          enum: [NOTE, TICKET, DISCUSSION, DISCARD]
        confidence:
          type: number
          format: double
        reason:
          type: string
          description: The model's own sentence, for a person deciding whether to agree.
        title: { type: string }
        nearest_page:
          type: string
          nullable: true
          description: |
            The closest existing page, when the proposal is a note. Always
            present as a field so "no nearby page" is `null` rather than absent,
            which a client would otherwise read as "not computed".
        project_key: { type: string }
        ticket_type: { type: string }
        description: { type: string }
        page_path: { type: string }
        verb:
          type: string
          enum: [create, append, supersede, relate]
          description: |
            What confirming does to existing authored text. `create` makes a new
            note; the other three touch one that exists, which is why
            `note_revisions_guard` requires a confirming person who is never an
            agent.
        target_note:
          type: string
          description: |
            The note the verb acts on — `CHR-0311`. **Required unless the verb
            is `create`**, and the reason it is on the card rather than only in
            the accept call: a person confirming an `append` is agreeing to
            change a specific piece of authored text, and cannot agree to that
            without being told which.
        body:
          type: string
          description: |
            The drafted note text, for a `NOTE` proposal. What acceptance writes
            as the first revision — so a person confirming without seeing it
            would be confirming text they have not read, which is the one thing
            the confirmation exists to prevent.
        opening_post:
          type: string
          description: The drafted first turn, for a `DISCUSSION` proposal. Same reasoning as `body`.

    ClearedField:
      type: object
      required: [field, value, reason]
      properties:
        field: { type: string }
        value:
          type: string
          description: What was proposed, kept so a person can see what was removed.
        reason: { type: string }

    LinkState:
      type: object
      description: |
        How a decision's journey to Switchyard ended, or has not. Tier 2 is
        written first and the ticket is created after, so every gap between
        those two is a state somebody has to be able to see.
      required: [destination, state, decided_at]
      properties:
        destination: { type: string }
        state:
          type: string
          description: "`in_flight`, `linked`, `unresolved`, `ambiguous` or `refused`."
        decided_at: { type: string, format: date-time }
        ticket_key: { type: string }
        ticket_url: { type: string }
        note_ref: { type: string }
        discussion_ref: { type: string }
        candidate_keys:
          type: array
          description: |
            What an `ambiguous` sweep found. More than one ticket carries this
            memo's id, and the service will not pick — choosing for a person
            here is how the wrong ticket gets linked silently.
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        swept_at: { type: string, format: date-time }
        refused_status:
          type: integer
          description: |
            The status Switchyard answered. Kept because it CACHES 4xx: an
            identical resend gets the same refusal, so the remedy is a new
            idempotency key rather than a retry.
        refused_reason: { type: string }
        refused_at: { type: string, format: date-time }

    AcceptRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TriageDecision"

    TriageDecision:
      type: object
      description: One person's decision about one memo.
      required: [memo_id]
      properties:
        memo_id: { type: string, format: uuid }
        proposer: { type: string }
        generation:
          type: integer
          nullable: true
          description: |
            The generation this decision was made against. Sent back so the
            server can refuse a decision made against a proposal that has since
            been regenerated.
        override:
          $ref: "#/components/schemas/Override"
        confirm_edit:
          type: boolean
          description: |
            Whether the person edited the proposal before confirming. Recorded
            because "agreed" and "agreed after rewriting it" are different facts
            about the model, and CHRN-36's eval reads them apart.

            A changed destination or title is an `override`, not a field here:
            the decision says which proposal it is about, and the override says
            what the person altered about it.

    Override:
      type: object
      description: |
        What the person changed. Every field is optional and an empty one means
        "leave the proposal's value alone" — which is why this is a separate
        object rather than a partial Proposal: a zero value here is a
        non-instruction, not a blanking.
      properties:
        destination: { type: string }
        title: { type: string }
        project_key: { type: string }
        ticket_type: { type: string }
        description: { type: string }
        verb:
          type: string
          enum: [create, append, supersede, relate]
        target_note: { type: string }
        page_path: { type: string }
        body: { type: string }
        opening_post: { type: string }

    TriageResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: |
            One per item, IN REQUEST ORDER. There is no batch-wide status and
            there must not be: the interesting case is item 7 of 12 failing, and
            a single status could not say which one to re-show.
          items:
            $ref: "#/components/schemas/TriageResult"

    TriageResult:
      type: object
      required: [memo_id, status]
      properties:
        memo_id: { type: string, format: uuid }
        status:
          type: string
          description: What happened to this one — landed, refused, stale, and so on.
        destination: { type: string }
        ticket_key: { type: string }
        ticket_url: { type: string }
        note_ref:
          type: string
          description: "`CHR-0311`, when this decision produced a note."
        discussion_ref:
          type: string
          description: "`DSC-0007`, when it produced a discussion."
        generation: { type: integer, nullable: true }
        cleared:
          type: array
          items:
            $ref: "#/components/schemas/ClearedField"
          x-go-type-skip-optional-pointer: true
        reason: { type: string }

    HoldRequest:
      type: object
      required: [memo_id]
      properties:
        memo_id: { type: string, format: uuid }
        reason:
          type: string
          description: |
            Optional. Most deferrals are "not now"; the ones that are not are
            the ones still legible in three weeks.

    ReleaseRequest:
      type: object
      required: [memo_id]
      properties:
        memo_id: { type: string, format: uuid }

    DeferredList:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeferredItem"
        limit: { type: integer }

    DeferredItem:
      type: object
      required: [memo_id, captured_at, held_by, held_at, age_seconds]
      properties:
        memo_id: { type: string, format: uuid }
        captured_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int32 }
        excerpt: { type: string }
        reason: { type: string }
        held_by: { type: string, format: uuid }
        held_at: { type: string, format: date-time }
        age_seconds:
          type: integer
          format: int64
          description: |
            Computed SERVER-SIDE. The question is "how long has this been
            waiting", and a client computing it from two clocks would get a
            different answer from the one the backlog report gives.

    TriageReport:
      type: object
      required: [backlog, deferred, in_flight, unresolved, ambiguous, refused]
      properties:
        backlog:
          $ref: "#/components/schemas/BacklogReport"
        deferred: { type: integer }
        in_flight:
          type: array
          items: { $ref: "#/components/schemas/LinkState" }
        unresolved:
          type: array
          description: The decision wrote tier 2 and the ticket never arrived.
          items: { $ref: "#/components/schemas/LinkState" }
        ambiguous:
          type: array
          description: More than one ticket claims this memo, and nothing will guess.
          items: { $ref: "#/components/schemas/LinkState" }
        refused:
          type: array
          description: Switchyard said no, and caches that answer.
          items: { $ref: "#/components/schemas/LinkState" }

    BacklogReport:
      type: object
      required: [total, today, this_week, older]
      properties:
        total: { type: integer }
        today: { type: integer }
        this_week: { type: integer }
        older: { type: integer }
        oldest_captured_at: { type: string, format: date-time }

    # ── REFERENCES ──────────────────────────────────────────────────────────
    # CHRN-51's Resolution, serialised (CHRN-104). The five states are the
    # contract; `upstream` is present when and only when an upstream answered;
    # `fetched_at` is absent on exactly the two states where nothing was
    # attempted (CHRN-97 ruling 7). Not a field added, not a state collapsed.

    ReferenceDescriptor:
      type: object
      description: |
        One estate reference as a note's text named it — CHRN-48's marker, as
        data. Derived from authored text by a deterministic scan: nothing in it
        is a copy of anything upstream, and nothing in it can go stale.

        A note payload (CHRN-98) emits these and the resolve endpoint takes
        them back. `token` is the text exactly as written and is never
        normalised — `CHR-0311` and `CHR-311` both carry `number: 311` and
        their own spelling — and everything else is what the grammar derives
        from it, which is why the server re-derives it rather than believing
        it.
      required: [system, token]
      properties:
        system:
          type: string
          enum: [switchyard, amber, chronicle]
          description: |
            Which upstream owns the namespace. **Colour keys off this and never
            off the project key** — coral is Switchyard, gold is Amber,
            anywhere either resolves. With fifteen live project keys a marker
            keyed on the project would make the estate colour rule a
            fifteen-way mapping every client has to duplicate.
        key:
          type: string
          description: |
            The project key for `switchyard` (`SWY`, `CHRN`), and `CHR` or
            `DSC` for `chronicle`. Absent for `amber`, whose citations carry no
            key.
        target:
          type: string
          enum: [note, discussion]
          description: What a `chronicle` reference points at. Absent for the other two systems.
        token:
          type: string
          description: The reference exactly as written.
        number:
          type: integer
          format: int64
          description: The number after the hyphen, for the `KEY-N` forms. Absent for `amber`.

    ResolveRequest:
      type: object
      required: [references]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            At most 50 — CHRN-51's cap, which counts attempts per render. The
            bound is enforced server-side as well as declared, and a larger
            batch is refused rather than truncated: a client that sent sixty
            and got fifty back would hold ten cards it could never explain.
          items:
            $ref: "#/components/schemas/ReferenceDescriptor"

    ResolveResponse:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: array
          description: One per descriptor, in request order, each carrying its `token`.
          items:
            $ref: "#/components/schemas/Resolution"

    Resolution:
      type: object
      description: |
        What Chronicle can say about one reference, right now. **An answer
        about a reference, never a copy of one.**

        The one distinction everything rests on: a fact about the REFERENT is
        not a fact about our ABILITY TO ASK. `upstream` is present when and
        only when an upstream answered — `resolved` and `broken` — and absent
        on the three states where nobody did. `state` says whether anybody
        could ask.
      required: [token, state]
      properties:
        token:
          type: string
          description: The descriptor's `token`, echoed so a client aligns the answer without depending on order.
        state:
          type: string
          enum: [resolved, broken, unreachable, unconfigured, unchecked]
          description: |
            Five, not two, and the length is the point.

            - `resolved` — the upstream answered and `upstream` is its answer.
            - `broken` — the upstream answered that there is no such thing, or
              that the reference is wrong. Still a fact about the referent, so
              `upstream` is present with whatever the answer contained.
            - `unreachable` — Chronicle ASKED and could not obtain an answer. A
              fact about Chronicle's knowledge, and the one no upstream can
              report. `last_resolved_at` says how long the outage has run.
            - `unconfigured` — this deployment has no credential for that
              upstream: nothing was dialled and nothing will be until a
              redeploy. A permanent state and not an outage; a card reading
              "unreachable" here would send somebody to check a service that
              is fine.
            - `unchecked` — NOBODY ASKED. The cap, the budget, or an earlier
              failure in this batch declined to dial, and no claim about this
              reference is being made. Draw it as "not checked", never as
              "checking…" — that is the state that is never answered.
        upstream:
          $ref: "#/components/schemas/ResolutionUpstream"
        fetched_at:
          type: string
          format: date-time
          description: |
            When the attempt was made. Present on `resolved`, `broken` and
            `unreachable`; **absent on `unchecked` and `unconfigured`**, where
            nothing was attempted (CHRN-97 ruling 7). Serialised as required
            it would carry `0001-01-01T00:00:00Z` on exactly the two states
            that exist to stop Chronicle making claims, and an ordinary
            relative-time formatter renders that as "checked 2,025 years ago".
            The Go type is a non-pointer that is zero there by convention; a
            convention does not cross a language boundary, so the wire makes
            the illegal state unrepresentable instead.
        last_resolved_at:
          type: string
          format: date-time
          description: |
            When this reference last resolved SUCCESSFULLY, within this
            process's memory. Absence means *never resolved within this
            process's memory* — not *not resolved now*. It travels through an
            `unreachable` so a card can say how long an outage has run; a
            client that read absence as staleness would render a cold start as
            an outage.
        explain:
          type: string
          description: |
            One sentence — the upstream's own where it has one (Amber's is
            relayed verbatim), Chronicle's for the states no upstream can
            report. Absent when a resolved answer had nothing to add. **It
            never carries a relative time**: "4 s ago" is true at
            serialisation and false in the hands of a client holding the
            payload.

    ResolutionUpstream:
      type: object
      description: |
        What the upstream said, present only when it said something. Chronicle
        is the upstream for its own `CHR-` and `DSC-` namespace, and it is the
        only namespace Chronicle mints a vocabulary member in.
      properties:
        key:
          type: string
          description: |
            The key AS ANSWERED, which is not always the key as written:
            Switchyard follows ticket aliases after a move, so `IDEA-21` can
            answer with key `CHRN-7`, and a `CHR-311` written by hand answers
            `CHR-0311`. On a `broken`, the key as written. Absent for Amber,
            which has no key.
        outcome:
          type: string
          description: |
            The UPSTREAM'S OWN vocabulary member, where it publishes one.
            Switchyard: the status category of a live ticket, and nothing on
            a missing one — it has no member meaning "deleted", and Chronicle
            does not mint one in somebody else's namespace to fill a field.
            Amber: `held`, `not_captured`, `prompt_only`, `not_in_capture`,
            `block_out_of_range`, `ambiguous`, or `malformed`. Chronicle's own:
            `deleted` on a soft-deleted note, `open` or `resolved` on a
            discussion, and nothing on a live note, which has no state to
            report.
        display_name:
          type: string
          description: The status as a person reads it. Switchyard only.
        title:
          type: string
          description: |
            The ticket's, the note's or the thread's title. Amber's card has no
            title to show, and a deleted note's is withheld along with its body.
        url:
          type: string
          description: |
            The outbound arrow's target. Absent where one would not land — a
            deleted ticket answers 404, Amber serves no HTML — and absent for
            Chronicle's own references, which the client holding them already
            knows how to open.
        recoverable:
          type: boolean
          description: |
            Amber's, relayed verbatim, and MEANINGFUL ONLY ON `broken`:
            `not_in_capture` and `ambiguous` are recoverable; `held`, the only
            resolved outcome, is a constant false. Present whenever Amber
            answered and absent for every other system.

    # ── PAGES AND NOTES ─────────────────────────────────────────────────────
    # E5's types transcribed (CHRN-98), not redesigned. Titles and bodies live
    # on revisions and never on the note row, so a rename is a revision exactly
    # as an edit is; the note-level `title` and `body` here are the CURRENT
    # revision's, and `revision` says which one that is.

    Page:
      type: object
      required: [id, path, slug, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path:
          type: string
          description: Derived from ancestry at read time, never stored — so it cannot be stale.
        slug: { type: string }
        parent_id:
          type: string
          format: uuid
          description: Absent on a root page.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PageTree:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          description: Every page's current path, sorted. The tree is a property of the strings.
          items: { type: string }

    NewPageRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: |
            The full path of the page to create. Every segment but the last
            must already exist; the last is the new slug — lowercase
            alphanumeric words joined by single hyphens.

    NoteSummary:
      type: object
      description: A note as a list carries it — enough to render a row and follow it.
      required: [ref, title, page, created_at, updated_at]
      properties:
        ref:
          type: string
          description: "`CHR-0311`. Permanent: the number is minted once and never reused."
        title: { type: string }
        page:
          type: string
          description: The path of the page it is filed on, current as of this read.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NoteList:
      type: object
      required: [page, items]
      properties:
        page:
          $ref: "#/components/schemas/Page"
        moved_from:
          type: string
          description: |
            Present when the path asked for was a redirect: the page has moved
            and this is the old path. A client holding it should update its
            link; an operator seeing it in a log knows an old path is still in
            circulation.
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
        next_cursor:
          type: string
          description: Absent at the end.

    Note:
      description: |
        A note, as `getNote` answers it. Tier 2. `html` is the current body
        rendered — safe to embed, because the renderer passes no raw HTML
        through — and `references` are the estate references that body names,
        as descriptors: derived from the text by a deterministic scan, carrying
        no upstream state and nothing that can go stale. Resolve them with
        `POST /references/resolve`.
      allOf:
        - $ref: "#/components/schemas/NoteSummary"
        - type: object
          required: [body, html, references, revision, resolved_from]
          properties:
            body:
              type: string
              description: The current revision's markdown, raw, for an editor.
            html:
              type: string
            references:
              type: array
              description: In order of appearance; a token named three times appears three times.
              items:
                $ref: "#/components/schemas/ReferenceDescriptor"
              x-go-type-skip-optional-pointer: true
            revision:
              $ref: "#/components/schemas/RevisionMeta"
            resolved_from:
              type: array
              description: |
                The discussions that concluded into this note — the reverse
                half of "linked both ways" (CHRN-46), read from
                `tier2.discussions` rather than stored on the note, because a
                note may be what several threads concluded. Empty when none.
              items:
                $ref: "#/components/schemas/DiscussionSummary"
              x-go-type-skip-optional-pointer: true

    NoteTombstone:
      type: object
      description: |
        What a soft-deleted note answers with. The note existed and was
        withdrawn; this says by whom and when and nothing else. Leaks, on
        purpose, that a note with this number once existed to anyone who may
        read notes at all.
      required: [ref, deleted_at, deleted_by]
      properties:
        ref: { type: string }
        deleted_at: { type: string, format: date-time }
        deleted_by: { type: string, format: uuid }

    RevisionMeta:
      type: object
      description: Which revision, by whom, and how it came to be — without its text.
      required: [id, seq, created_at, author_id]
      properties:
        id: { type: string, format: uuid }
        seq:
          type: integer
          description: 1 for the first revision. Only ever grows; a restore appends.
        created_at: { type: string, format: date-time }
        author_id:
          type: string
          format: uuid
          description: Whose words these are. May be an agent, for a Scribe-routed memo.
        confirmed_by:
          type: string
          format: uuid
          description: |
            Who agreed to this text landing — never an agent. A different
            question from `author_id`. Absent only on rows written before the
            guard existed.
        verb:
          type: string
          enum: [create, append, supersede, relate]
          description: What a person confirmed about a Scribe proposal. Absent when somebody typed the text directly.
        memo_id:
          type: string
          format: uuid
          description: The memo this text came from, when it came from one.
        restored_from:
          type: string
          format: uuid
          description: The revision this one reproduces, when it is a restore.

    Revision:
      description: A revision with its text — history is what was written, raw.
      allOf:
        - $ref: "#/components/schemas/RevisionMeta"
        - type: object
          required: [title, body]
          properties:
            title: { type: string }
            body: { type: string }

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        next_cursor:
          type: string
          description: Absent at the end.

    NewNoteRequest:
      type: object
      required: [page, title, body]
      properties:
        page:
          type: string
          minLength: 1
          description: The path to file it on. Must exist; redirects are not followed.
        title:
          type: string
          minLength: 1
        body:
          type: string
          description: Markdown, stored raw.

    AppendRevisionRequest:
      type: object
      required: [body]
      properties:
        title:
          type: string
          description: Omitted keeps the current title.
        body:
          type: string
          description: Markdown, stored raw. The whole new body, not a diff.

    AppendResult:
      type: object
      required: [revision, followed]
      properties:
        revision:
          $ref: "#/components/schemas/RevisionMeta"
        followed:
          $ref: "#/components/schemas/RevisionPointer"

    RevisionPointer:
      type: object
      description: The revision that was current when the request was read.
      required: [id, seq]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }

    DiscussionSummary:
      type: object
      description: A thread, as a note's provenance names it. CHRN-99 carries the full thread.
      required: [ref, title, resolved_at]
      properties:
        ref:
          type: string
          description: "`DSC-0007`."
        title: { type: string }
        resolved_at: { type: string, format: date-time }

    # ── SEARCH ──────────────────────────────────────────────────────────────
    SearchResults:
      type: object
      required: [query, limit, items]
      properties:
        query: { type: string }
        limit:
          type: integer
          description: The cap the answer was clamped to.
        items:
          type: array
          description: Best first. Not a page of anything.
          items:
            $ref: "#/components/schemas/SearchHit"

    SearchHit:
      type: object
      description: |
        One result. `kind` says which of the two field sets is present — a
        note carries `ref` and `title`, a transcript carries `memo_id` and
        `model` — and they are mutually exclusive.
      required: [kind, snippet, rank, created_at]
      properties:
        kind:
          type: string
          enum: [note, transcript]
          description: Authored versus transcribed, which is the distinction that is not cosmetic.
        ref:
          type: string
          description: "`CHR-0311`, on a note hit."
        title:
          type: string
          description: On a note hit.
        memo_id:
          type: string
          format: uuid
          description: On a transcript hit.
        model:
          type: string
          description: On a transcript hit. Runner-qualified, e.g. `whisper.cpp/small.en`, so the operator can see which decode matched.
        snippet:
          type: string
          description: |
            Up to two fragments around the match, fragments joined by ` … `,
            each match wrapped in a bare `<b>`. Safe to embed: everything but
            those two tags is HTML-escaped, because a note body is stored raw
            and the fragment is a slice of it.
        rank:
          type: number
          format: float
        created_at: { type: string, format: date-time }
